<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>A Blessing For You</title>

<script src="config.js"></script>

<style>

/* =====================================================
   RESET
===================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 25px;

  background:
    radial-gradient(circle at 50% 25%, #681426 0%, #4c0a16 48%, #2e0610 100%);

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}


/* =====================================================
   LOADING / ERROR
===================================================== */

/* =====================================================
   LOADING / ERROR
   ===================================================== */

.loading,
.error-box {
  width: min(430px, 100%);
  padding: 30px;
  border-radius: 18px;
  background: rgba(255,250,242,.97);
  text-align: center;
  color: #4c0a16;
  box-shadow: 0 24px 70px rgba(0,0,0,.28);
  border: 1px solid rgba(200,155,60,.35);
}

.loading {
  position: relative;
  overflow: hidden;
  padding: 34px 30px 30px;
}

.loading::before {
  content: "";
  position: absolute;
  inset: -55%;
  background:
    repeating-conic-gradient(
      from 0deg,
      rgba(200,155,60,.10) 0deg 5deg,
      transparent 5deg 20deg
    );
  animation: loading-rays 12s linear infinite;
}

.loading-content {
  position: relative;
  z-index: 1;
}

.loading-symbol {
  width: 64px;
  height: 64px;
  margin: 0 auto 18px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #c89b3c;
  background: rgba(200,155,60,.09);
  border: 1px solid rgba(200,155,60,.38);
  font-family: Georgia, serif;
  font-size: 30px;
  animation: loading-pulse 1.8s ease-in-out infinite;
}

.loading h2 {
  margin: 0 0 8px;
  font-family: Georgia, serif;
  font-size: 21px;
  font-weight: 700;
}

.loading p {
  margin: 0;
  font-size: 13px;
  opacity: .68;
}

.loading-bar {
  width: 150px;
  height: 3px;
  margin: 20px auto 0;
  overflow: hidden;
  border-radius: 99px;
  background: rgba(76,10,22,.10);
}

.loading-bar::after {
  content: "";
  display: block;
  width: 45%;
  height: 100%;
  border-radius: inherit;
  background: #c89b3c;
  animation: loading-bar 1.15s ease-in-out infinite;
}

@keyframes loading-rays {
  to { transform: rotate(360deg); }
}

@keyframes loading-pulse {
  0%,100% { transform: scale(.96); opacity: .78; }
  50% { transform: scale(1.04); opacity: 1; }
}

@keyframes loading-bar {
  0% { transform: translateX(-150%); }
  100% { transform: translateX(330%); }
}

.app-ready {
  animation: card-appear .45s ease both;
}

@keyframes card-appear {
  from { opacity: 0; transform: scale(.985) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.error-box h2 {
  margin-top: 0;
}


/* =====================================================
   CARD
===================================================== */

.card {

  --outer-border-color: #c89b3c;
  --inner-border-color: #c89b3c;
  --font-color: #4c0a16;
  --texture: none;
  --texture-color: #C89B3C;

  position: relative;

  width: 430px;
  height: 500px;

  max-width: 100%;

  overflow: hidden;

  border:
    2px solid
    var(--outer-border-color);

  border-radius: 12px;

  background:
    #fffaf2;

  color:
    var(--font-color);

  font-family:
    Georgia,
    serif;

  box-shadow:
    0 20px 50px rgba(0,0,0,.3);
}


/* =====================================================
   BACKGROUND TEXTURE
===================================================== */

.card::before {

  content: "";

  position: absolute;

  inset: 0;

  background-image:
    var(--texture);

  background-size:
    auto,
    auto,
    auto;

  pointer-events: none;

  opacity: .45;

  z-index: 0;
}


/* =====================================================
   INNER BORDER
===================================================== */

.card::after {

  content: "";

  position: absolute;

  inset: 12px;

  border:
    var(--inner-border-width, 1px)
    var(--inner-border-style, solid)
    var(--inner-border-color);

  border-radius: 9px;

  pointer-events: none;

  z-index: 20;
}


/* =====================================================
   SYMBOL
===================================================== */

.symbol {

  position: absolute;

  top: 25px;

  left: 0;
  right: 0;

  text-align: center;

  font-size: 27px;

  line-height: 1;

  z-index: 5;
}


/* =====================================================
   SMALL TITLE
===================================================== */

.small-title {

  position: absolute;

  top: 61px;

  left: 30px;
  right: 30px;

  text-align: center;

  font-size: 10px;

  letter-spacing: 3px;

  text-transform: uppercase;

  opacity: .65;

  z-index: 5;
}


/* =====================================================
   MAIN TITLE
===================================================== */

.title {

  position: absolute;

  top: 82px;

  left: 28px;
  right: 28px;

  margin: 0;

  text-align: center;

  font-size: 25px;

  line-height: 1.2;

  z-index: 5;
}


/* =====================================================
   RECIPIENT
===================================================== */

.recipient {

  position: absolute;

  top: 124px;

  left: 30px;
  right: 30px;

  text-align: center;

  font-size: 13px;

  opacity: .78;

  z-index: 5;
}


/* =====================================================
   CONTENT
===================================================== */

.content {

  position: absolute;

  top: 154px;

  left: 34px;
  right: 34px;

  bottom: 62px;

  display: flex;

  flex-direction: column;

  z-index: 5;

  min-height: 0;
}


/* =====================================================
   MESSAGE
===================================================== */

.message {

  flex: 1;

  min-height: 80px;

  padding:
    8px
    5px
    10px;

  overflow: hidden;

  text-align: center;

  white-space: pre-wrap;

  word-break: break-word;

  font-size: 16px;

  line-height: 1.55;
}


/* =====================================================
   PHOTO AREA
===================================================== */

.photo-stage {

  position: relative;

  flex: 1;

  min-height: 120px;

  overflow: hidden;
}


/* =====================================================
   PHOTO
===================================================== */

.photo-item {

  position: absolute;

  overflow: hidden;

  border-radius: 3px;

  transform-origin: center center;
}

.photo-item img {

  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;

  transform-origin: center center;

  user-select: none;

  -webkit-user-drag: none;
}


/* =====================================================
   FROM
===================================================== */

.from {

  position: absolute;

  left: 28px;
  right: 28px;

  bottom: 27px;

  text-align: center;

  font-size: 13px;

  z-index: 5;
}


/* =====================================================
   CREATE BUTTON
===================================================== */

.create-button {

  position: fixed;

  left: 50%;

  bottom: 18px;

  transform:
    translateX(-50%);

  padding:
    11px 18px;

  border: 0;

  border-radius: 8px;

  background:
    white;

  color:
    #4c0a16;

  font-weight: 700;

  cursor: pointer;

  box-shadow:
    0 7px 20px rgba(0,0,0,.25);

  z-index: 100;
}

.create-button:hover {

  transform:
    translateX(-50%)
    translateY(-1px);

  box-shadow:
    0 9px 24px rgba(0,0,0,.3);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px) {

  body {

    padding: 10px;

    overflow: hidden;
  }

  .card {

    width: 430px;

    height: 500px;

    transform:
      scale(
        calc(
          (100vw - 20px) / 430
        )
      );

    transform-origin:
      center center;

    flex-shrink: 0;
  }

  .create-button {

    bottom: 10px;

    font-size: 13px;

    padding:
      10px 15px;
  }
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
  }
}

</style>

</head>


<body>


<div
  id="app"
  class="loading"
  role="status"
  aria-live="polite">

  <div class="loading-content">
    <div class="loading-symbol" aria-hidden="true">✝</div>
    <h2>Preparing Your Blessing</h2>
    <p id="loading-message">Please wait a moment...</p>
    <div class="loading-bar" aria-hidden="true"></div>
  </div>

</div>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
  window.YSL_CONFIG &&
  window.YSL_CONFIG.API_URL
    ? window.YSL_CONFIG.API_URL
    : "";


/* =====================================================
   TEXTURE HELPERS
===================================================== */

function hexToRgba(
  hex,
  alpha
) {

  let h =
    String(
      hex ||
      "#C89B3C"
    )
    .replace(
      "#",
      ""
    );

  if (h.length === 3) {

    h =
      h
        .split("")
        .map(
          x =>
            x + x
        )
        .join("");

  }

  if (h.length !== 6) {

    h = "C89B3C";

  }

  const r =
    parseInt(
      h.substring(0, 2),
      16
    );

  const g =
    parseInt(
      h.substring(2, 4),
      16
    );

  const b =
    parseInt(
      h.substring(4, 6),
      16
    );

  return `
    rgba(
      ${r},
      ${g},
      ${b},
      ${alpha}
    )
  `;
}


/* =====================================================
   TEXTURE GENERATOR
===================================================== */

function validTextureHex(value){
  return typeof value === "string" && /^#[0-9A-Fa-f]{6}$/.test(value);
}

function normalizeTextureName(value) {
  const map = {
    "Dotted Sun Rays":"dotted-sun-rays",
    "Radiant Dot Pattern":"radiant-dot",
    "Sacred Halftone Rays":"halftone",
    "Soft Ray Lines":"soft-rays",
    "Divine Light Texture":"divine",
    "Minimal Sunburst":"sunburst",
    "Golden Ray Grid":"golden-grid",
    "Subtle Radiance":"radiance",
    "Ethereal Dot Rays":"ethereal",
    "Sacred Light Lines":"light-lines",
    "Fine Dotted Rays":"fine-dotted",
    "Glowing Sunburst":"glowing",
    "Minimal Divine Rays":"minimal-rays",
    "Light Beam Texture":"beam",
    "Elegant Ray Pattern":"elegant"
  };
  return map[value] || value || "dotted-sun-rays";
}

function getFontFamily(font){
  const fonts = {
    serif: "Georgia, 'Times New Roman', serif",
    classic: "'Times New Roman', Georgia, serif",
    modern: "Arial, Helvetica, sans-serif",
    elegant: "Garamond, Georgia, serif",
    georgia: "Georgia, serif",
    palatino: "'Palatino Linotype', Palatino, Georgia, serif",
    garamond: "Garamond, Georgia, serif",
    cursive: "'Brush Script MT', 'Segoe Script', cursive",
    sans: "Arial, Helvetica, sans-serif"
  };
  return fonts[String(font || "").toLowerCase()] || font || fonts.serif;
}

function getTexture(
  type,
  color
) {

  type = normalizeTextureName(type);

  const c =
    hexToRgba(
      color,
      .28
    );

  const c2 =
    hexToRgba(
      color,
      .12
    );

  const textures = {

    "dotted-sun-rays":
      `radial-gradient(circle at center,${c} 1px,transparent 1.6px),repeating-conic-gradient(from 0deg at 50% 50%,${c2} 0deg 3deg,transparent 3deg 14deg)`,

    "radiant-dot":
      `radial-gradient(circle,${c} 1px,transparent 1.5px)`,

    "halftone":
      `radial-gradient(circle at center,${c} 1px,transparent 2px),repeating-conic-gradient(${c2} 0deg 2deg,transparent 2deg 15deg)`,

    "soft-rays":
      `repeating-conic-gradient(from 0deg at 50% 50%,${c2} 0deg 2deg,transparent 2deg 17deg)`,

    "divine":
      `radial-gradient(circle at 50% 20%,${c},transparent 45%)`,

    "sunburst":
      `repeating-conic-gradient(from 0deg at 50% 50%,${c2} 0deg 4deg,transparent 4deg 28deg)`,

    "golden-grid":
      `linear-gradient(${c2} 1px,transparent 1px),linear-gradient(90deg,${c2} 1px,transparent 1px)`,

    "radiance":
      `radial-gradient(circle at center,${c2},transparent 58%)`,

    "ethereal":
      `radial-gradient(circle at center,${c} 1px,transparent 1.7px),repeating-conic-gradient(${c2} 0deg 1deg,transparent 1deg 18deg)`,

    "light-lines":
      `repeating-linear-gradient(45deg,transparent 0 18px,${c2} 19px,transparent 20px)`,

    "fine-dotted":
      `radial-gradient(circle at center,${c} 1px,transparent 1.5px),repeating-conic-gradient(${c2} 0deg 1deg,transparent 1deg 12deg)`,

    "glowing":
      `radial-gradient(circle at center,${c},transparent 48%),repeating-conic-gradient(${c2} 0deg 3deg,transparent 3deg 20deg)`,

    "minimal-rays":
      `repeating-conic-gradient(from -10deg at 50% 50%,${c2} 0deg 2deg,transparent 2deg 30deg)`,

    "beam":
      `repeating-linear-gradient(110deg,transparent 0 28px,${c2} 29px,transparent 31px)`,

    "elegant":
      `repeating-conic-gradient(from 5deg at 50% 50%,${c2} 0deg 1deg,transparent 1deg 22deg)`

  };

  return (
    textures[type] ||
    textures["dotted-sun-rays"]
  );
}


/* =====================================================
   NORMALIZE STATE
===================================================== */

function normalizeState(
  state
) {

  state =
    state && typeof state === "object"
      ? state
      : {};

  const texture = normalizeTextureName(
    state.backgroundTexture ||
    state.texture ||
    "dotted-sun-rays"
  );

  const message =
    state.message !== undefined
      ? state.message
      : (state.msg || "");

  return {
    title:
      state.title ||
      state.cardTitle ||
      "A Blessing For You",

    to:
      state.to ||
      state.recipient ||
      "YSL",

    recipient:
      state.recipient ||
      state.to ||
      "YSL",

    from:
      state.from ||
      state.sender ||
      "KIM",

    message,
    msg:
      state.msg !== undefined
        ? state.msg
        : message,

    photos:
      Array.isArray(state.photos)
        ? state.photos
        : [],

    symbol:
      state.symbol !== undefined
        ? state.symbol
        : "✝",

    texture,
    backgroundTexture: texture,

    textureColor:
      validTextureHex(state.textureColor)
        ? state.textureColor
        : "#C89B3C",

    backgroundColor:
      state.backgroundColor ||
      state.bgColor ||
      state.cardBackground ||
      "#fffdfb",

    borderColor:
      state.borderColor ||
      "#C89B3C",

    innerBorderColor:
      state.innerBorderColor ||
      state.borderColor ||
      "#C89B3C",

    innerBorder:
      state.innerBorder ||
      "fine",

    fontColor:
      state.fontColor ||
      "#4C0A16",

    font:
      state.font ||
      "Georgia"
  };
}


/* =====================================================
   INNER BORDER
===================================================== */

function applyInnerBorder(
  card,
  type
) {

  card.style.setProperty(
    "--inner-border-width",
    "1px"
  );

  card.style.setProperty(
    "--inner-border-style",
    "solid"
  );


  switch (type) {

    case "none":

      card.style.setProperty(
        "--inner-border-width",
        "0px"
      );

      break;


    case "fine":

      card.style.setProperty(
        "--inner-border-width",
        "1px"
      );

      card.style.setProperty(
        "--inner-border-style",
        "solid"
      );

      break;


    case "double":

      card.style.setProperty(
        "--inner-border-width",
        "3px"
      );

      card.style.setProperty(
        "--inner-border-style",
        "double"
      );

      break;


    case "dotted":

      card.style.setProperty(
        "--inner-border-width",
        "1px"
      );

      card.style.setProperty(
        "--inner-border-style",
        "dotted"
      );

      break;


    case "dashed":

      card.style.setProperty(
        "--inner-border-width",
        "1px"
      );

      card.style.setProperty(
        "--inner-border-style",
        "dashed"
      );

      break;


    case "elegant":

      card.style.setProperty(
        "--inner-border-width",
        "1px"
      );

      card.style.setProperty(
        "--inner-border-style",
        "double"
      );

      break;


    default:

      card.style.setProperty(
        "--inner-border-width",
        "1px"
      );

      card.style.setProperty(
        "--inner-border-style",
        "solid"
      );

      break;

  }
}


/* =====================================================
   PHOTO SOURCE
===================================================== */

function getPhotoSource(
  photo
) {

  if (!photo) {
    return "";
  }

  return (
    photo.dataUrl ||
    photo.url ||
    photo.src ||
    ""
  );
}


/* =====================================================
   PHOTO NUMBER
===================================================== */

function numberOrDefault(
  value,
  fallback
) {

  const number =
    Number(value);

  return Number.isFinite(number)
    ? number
    : fallback;
}


/* =====================================================
   PHOTO POSITION
===================================================== */

function applyPhotoPosition(
  item,
  photo
) {

  /*
   Supports both:
   - percentage positions
   - pixel positions

   The builder normally stores x/y as percentages.
  */

  const x =
    numberOrDefault(
      photo.x,
      5
    );

  const y =
    numberOrDefault(
      photo.y,
      5
    );


  if (
    photo.xUnit === "px" ||
    photo.positionUnit === "px"
  ) {

    item.style.left =
      x + "px";

  }

  else {

    item.style.left =
      x + "%";

  }


  if (
    photo.yUnit === "px" ||
    photo.positionUnit === "px"
  ) {

    item.style.top =
      y + "px";

  }

  else {

    item.style.top =
      y + "%";

  }


  const width =
    numberOrDefault(
      photo.width,
      100
    );

  const height =
    numberOrDefault(
      photo.height,
      100
    );


  item.style.width =
    Math.max(
      10,
      width
    ) + "px";


  item.style.height =
    Math.max(
      10,
      height
    ) + "px";
}


/* =====================================================
   PHOTO RENDER
===================================================== */

function renderPhotos(
  stage,
  photos
) {

  if (
    !Array.isArray(photos)
  ) {
    return;
  }


  photos.forEach(
    photo => {

      const src =
        getPhotoSource(
          photo
        );


      if (!src) {
        return;
      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "photo-item";


      applyPhotoPosition(
        item,
        photo
      );


      const img =
        document.createElement(
          "img"
        );


      img.src =
        src;


      img.alt =
        photo.name ||
        photo.fileName ||
        "Blessing photo";


      /*
       * Crop position
       */

      const cropX =
        numberOrDefault(
          photo.cropX,
          50
        );

      const cropY =
        numberOrDefault(
          photo.cropY,
          50
        );


      img.style.objectPosition =
        cropX +
        "% " +
        cropY +
        "%";


      /*
       * Crop zoom
       */

      // Builder stores zoom as 100 = normal size.
      // Older cards may store cropZoom as 1 = normal size.
      let cropZoom;
      if (photo.zoom !== undefined && photo.zoom !== null && photo.zoom !== "") {
        cropZoom = Math.max(0.1, numberOrDefault(photo.zoom, 100) / 100);
      } else {
        cropZoom = Math.max(0.1, numberOrDefault(photo.cropZoom, 1));
      }


      /*
       * Rotation
       */

      const rotation =
        numberOrDefault(
          photo.rotation,
          0
        );


      img.style.transform =
        "rotate(" +
        rotation +
        "deg) scale(" +
        cropZoom +
        ")";

      // Keep the image visually stable while the card animates in.
      img.style.transformOrigin = "center center";


      item.appendChild(
        img
      );


      stage.appendChild(
        item
      );

    }
  );
}


/* =====================================================
   RENDER CARD
===================================================== */

function renderCard(
  rawState
) {

  const state =
    normalizeState(
      rawState
    );


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "card";


  /*
   * Colors
   */

  card.style.setProperty(
    "--outer-border-color",
    state.borderColor
  );

  card.style.setProperty(
    "--inner-border-color",
    state.innerBorderColor
  );

  card.style.setProperty(
    "--font-color",
    state.fontColor
  );


  /*
   * Texture
   */

  card.style.setProperty(
    "--texture",
    getTexture(
      state.texture,
      state.textureColor
    )
  );

  card.style.setProperty(
    "--texture-color",
    state.textureColor
  );


  /*
   * Font
   */

  card.style.fontFamily =
    getFontFamily(state.font);

  card.style.backgroundColor =
    state.backgroundColor;


  /*
   * Inner border
   */

  applyInnerBorder(
    card,
    state.innerBorder
  );


  /*
   * Main HTML
   */

  const symbol =
    document.createElement(
      "div"
    );

  symbol.className =
    "symbol";

  symbol.textContent =
    state.symbol;


  const smallTitle =
    document.createElement(
      "div"
    );

  smallTitle.className =
    "small-title";

  smallTitle.textContent =
    "A Blessing For You";


  const title =
    document.createElement(
      "h1"
    );

  title.className =
    "title";

  title.textContent =
    state.title;


  const recipient =
    document.createElement(
      "div"
    );

  recipient.className =
    "recipient";

  recipient.textContent =
    state.to ||
    state.recipient ||
    "YSL";


  const content =
    document.createElement(
      "div"
    );

  content.className =
    "content";


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message";

  message.textContent =
    state.message ||
    state.msg ||
    "";


  const photoStage =
    document.createElement(
      "div"
    );

  photoStage.className =
    "photo-stage";


  renderPhotos(
    photoStage,
    state.photos
  );


  content.appendChild(
    message
  );

  content.appendChild(
    photoStage
  );


  const from =
    document.createElement(
      "div"
    );

  from.className =
    "from";

  from.textContent =
    "—" +
    (
      state.from ||
      "KIM"
    );


  card.appendChild(
    symbol
  );

  card.appendChild(
    smallTitle
  );

  card.appendChild(
    title
  );

  card.appendChild(
    recipient
  );

  card.appendChild(
    content
  );

  card.appendChild(
    from
  );


  return card;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


/* =====================================================
   LOAD CARD
===================================================== */

function setLoadingMessage(message){
  const el = document.getElementById("loading-message");
  if(el) el.textContent = message;
}

function wait(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function waitForImages(root) {
  const images = Array.from(root.querySelectorAll("img"));
  if (!images.length) return;
  await Promise.all(images.map(img => {
    if (img.complete) return Promise.resolve();
    return new Promise(resolve => {
      img.addEventListener("load", resolve, { once: true });
      img.addEventListener("error", resolve, { once: true });
    });
  }));
}


async function loadCard() {

  const app =
    document.getElementById(
      "app"
    );

  const loadingMessage =
    document.getElementById(
      "loading-message"
    );


  /*
   * Get short card ID
   *
   * Example:
   *
   * view-card.html?id=ABC123
   */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  if (!id) {

    showError(
      "This blessing link is missing its card ID."
    );

    return;
  }


  if (!API_URL) {

    showError(
      "The card API is not configured."
    );

    return;
  }


  try {

    setLoadingMessage("Connecting to the blessing...");

    /*
     * Public card endpoint
     */

    const url =
      API_URL +
      "?action=getPublic&creationId=" +
      encodeURIComponent(id) +
      "&_=" +
      Date.now();


    if (loadingMessage) {
      loadingMessage.textContent =
        "Connecting to your blessing...";
    }

    setLoadingMessage("Loading your saved card...");

    const response =
      await fetch(
        url,
        {
          method: "GET",
          credentials: "omit",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Server returned HTTP " +
        response.status
      );
    }


    if (loadingMessage) {
      loadingMessage.textContent =
        "Opening your blessing...";
    }

    setLoadingMessage("Preparing your blessing...");

    const result =
      await response.json();


    if (!result.ok) {

      throw new Error(
        result.error ||
        "Blessing card not found."
      );
    }


    /*
     * Backend may return state
     * as an object or JSON string.
     */

    let state =
      result.state ||
      (result.data && result.data.state) ||
      (result.card && result.card.state) ||
      result.data ||
      {};


    if (
      typeof state ===
      "string"
    ) {

      try {

        state =
          JSON.parse(
            state
          );

      }

      catch(error) {

        throw new Error(
          "The saved blessing data is invalid."
        );

      }
    }


    /*
     * Render
     */

    if (loadingMessage) {
      loadingMessage.textContent =
        "Almost ready...";
    }

    setLoadingMessage("Adding your message and photos...");

    const card =
      renderCard(
        state
      );

    setLoadingMessage("Loading photos...");
    await waitForImages(card);
    setLoadingMessage("Your blessing is ready.");
    await wait(180);

    app.className = "app-ready";

    app.innerHTML = "";

    card.classList.add("reveal");

    app.appendChild(
      card
    );


    /*
     * Create button
     */

    const button =
      document.createElement(
        "button"
      );


    button.className =
      "create-button";


    button.type =
      "button";


    button.textContent =
      "Create Your Own Blessing";


    button.addEventListener(
      "click",
      function() {

        window.location.href =
          "card-builder.html";

      }
    );


    document.body.appendChild(
      button
    );

  }

  catch(error) {

    console.error(
      "VIEW CARD ERROR:",
      error
    );


    showError(
      error.message ||
      "Unable to load this blessing."
    );

  }
}


/* =====================================================
   ERROR
===================================================== */

function showError(
  message
) {

  const app =
    document.getElementById(
      "app"
    );


  app.className =
    "error-box";
  app.setAttribute(
    "role",
    "alert"
  );


  app.innerHTML = `

    <h2>
      Blessing Unavailable
    </h2>

    <p>
      ${escapeHtml(
        message
      )}
    </p>

    <button
      class="create-button"
      type="button"
      onclick="location.href='card-builder.html'">

      Create Your Own Blessing

    </button>

  `;
}


/* =====================================================
   START
===================================================== */

loadCard();

</script>
