<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Petit+Formal+Script&display=swap" rel="stylesheet">
<style>
:root{--gold:#c99a3d;--gold-soft:#e3c988;--cream:#f4e8d9;--dim:#cdb2a6;--panel:#2a0a10}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:rgba(24,5,8,.96);color:var(--cream);overflow:hidden}.menu{height:100%;display:flex;flex-direction:column;border-top:1px solid rgba(201,154,61,.18);box-shadow:0 -12px 30px rgba(0,0,0,.18)}
.categories{height:50px;display:flex;align-items:center;justify-content:center;gap:3px;overflow-x:auto;scrollbar-width:none;padding:0 12px}.categories::-webkit-scrollbar{display:none}.category{border:0;background:transparent;color:var(--dim);font-size:12px;padding:8px 13px;border-radius:18px;cursor:pointer;white-space:nowrap}.category:hover{color:var(--gold-soft)}.category.active{background:rgba(201,154,61,.13);color:var(--gold-soft)}
.items{flex:1;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;padding:4px 22px 11px}.items::-webkit-scrollbar{display:none}.item-list{display:flex;gap:17px;margin:auto}.item{width:72px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;user-select:none}.preview{width:57px;height:57px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.045);border:1px solid rgba(201,154,61,.2);transition:.18s;font-size:25px;color:var(--cream)}.item:hover .preview{transform:translateY(-2px);border-color:var(--gold-soft)}.item.active .preview{border-color:var(--gold);background:rgba(201,154,61,.14);box-shadow:0 0 0 3px rgba(201,154,61,.07)}.label{font-size:10px;color:var(--dim);white-space:nowrap;max-width:72px;overflow:hidden;text-overflow:ellipsis;text-align:center}
.color-preview{width:34px;height:34px;border-radius:50%;background:var(--sw);border:2px solid rgba(255,255,255,.16)}.font-serif{font-family:'Cormorant Garamond',Georgia,serif;font-size:23px}.font-script{font-family:'Petit Formal Script',cursive;font-size:20px}.font-sans{font-family:Arial,sans-serif;font-size:15px}
.text-item{width:150px}.text-box{width:150px;display:flex;flex-direction:column;gap:4px}.text-box label{font-size:9px;color:var(--dim)}.text-box input,.text-box textarea{width:100%;border:1px solid rgba(201,154,61,.28);background:rgba(0,0,0,.22);color:var(--cream);border-radius:5px;padding:7px 8px;font-size:11px;outline:none}.text-box textarea{height:48px;resize:none}.text-box input:focus,.text-box textarea:focus{border-color:var(--gold)}.photo-upload{width:150px;padding:10px;border:1px dashed rgba(201,154,61,.45);border-radius:8px;background:rgba(0,0,0,.18);color:var(--cream);font-size:10px}.history-note{width:190px;color:var(--dim);font-size:10px;line-height:1.45;text-align:center}.history-btn{border:1px solid rgba(201,154,61,.45);background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#241012;border-radius:14px;padding:6px 10px;font-size:10px;font-weight:bold;cursor:pointer}.text-save{border:1px solid rgba(201,154,61,.45);background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#241012;border-radius:14px;padding:5px 9px;font-size:10px;font-weight:bold;cursor:pointer}
@media(max-width:700px){.categories{justify-content:flex-start}.item-list{margin-left:0}.items{padding-left:12px;padding-right:12px}.item{width:68px}.preview{width:52px;height:52px}}
 
.text-box{width:150px}
.text-box input,.text-box textarea{font-family:inherit}
.text-box textarea{height:48px;resize:none}
.slider-wrap{display:flex;align-items:center;gap:7px}
.message-slider{width:100%;accent-color:var(--gold)}
.slider-value{min-width:34px;text-align:right;color:var(--gold-soft);font-size:9px}
.photo-upload{cursor:pointer}
.photo-list{display:flex;gap:7px;max-width:320px;overflow-x:auto;padding:2px}
.photo-thumb{position:relative;flex:0 0 58px;height:58px;border:1px solid rgba(201,154,61,.35);border-radius:6px;overflow:hidden;background:#180508;cursor:pointer}
.photo-thumb.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,154,61,.3)}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-thumb button{position:absolute;right:2px;top:2px;width:17px;height:17px;border:0;border-radius:50%;background:rgba(42,10,16,.9);color:var(--gold-soft);font-size:11px;cursor:pointer}
.photo-controls{display:flex;flex-direction:column;gap:4px;width:150px}
.photo-controls label{font-size:9px;color:var(--dim);display:flex;justify-content:space-between}
.photo-slider{width:100%;accent-color:var(--gold)}
.menu-hint{font-size:9px;line-height:1.3;color:var(--dim)}
@media(max-width:700px){.text-item{width:145px}.text-box,.photo-controls{width:145px}}
</style>
</head>
<body>
<div class="menu">
  <div class="categories">
    <button class="category active" data-category="text">Message</button>
    <button class="category" data-category="symbol">Symbols</button>
    <button class="category" data-category="frame">Frames</button>
    <button class="category" data-category="background">Backgrounds</button>
    <button class="category" data-category="color">Colors</button>
    <button class="category" data-category="font">Lettering</button>
    <button class="category" data-category="photo">Photo</button>
    <button class="category" data-category="history">History</button>
  </div>
  <div class="items"><div class="item-list" id="itemList"></div></div>
</div>
 
<script>
(function(){
"use strict";
 
var state={
  to:"YSL",
  msg:"Thinking of you today — may the Lord renew your strength like the eagle's wings.",
  verse:"Isaiah 40:31",
  from:"KIM",
  symbol:"🕊️",
  frame:"frame-classic",
  bg:"bg-plain",
  accent:"gold",
  font:"font-serif",
  messageHeight:110,
  photos:[]
};
 
var DATA={
symbol:[
{name:"Dove",value:"🕊️"},{name:"Cross",value:"✝️"},{name:"Flame",value:"🔥"},
{name:"Wheat",value:"🌾"},{name:"Candle",value:"🕯️"},{name:"Prayer",value:"🙏"},
{name:"Heart",value:"❤️"},{name:"Sunrise",value:"☀️"}
],
frame:[
{name:"Classic",value:"frame-classic",preview:"▣"},
{name:"Ornate",value:"frame-ornate",preview:"▤"},
{name:"Dashed",value:"frame-scallop",preview:"▧"},
{name:"Simple",value:"frame-simple",preview:"□"}
],
background:[
{name:"Plain",value:"bg-plain",preview:"○"},
{name:"Rays",value:"bg-rays",preview:"☀"},
{name:"Dotted",value:"bg-dots",preview:"⠿"},
{name:"Woven",value:"bg-weave",preview:"▦"}
],
color:[
{name:"Gold",value:"gold",color:"#c99a3d"},
{name:"Rose",value:"rose",color:"#c97b8c"},
{name:"Ember",value:"ember",color:"#b4522f"},
{name:"Dawn",value:"dawn",color:"#8fa6c9"}
],
font:[
{name:"Serif",value:"font-serif",preview:"Aa",className:"font-serif"},
{name:"Script",value:"font-script",preview:"Aa",className:"font-script"},
{name:"Sans",value:"font-sans",preview:"Aa",className:"font-sans"}
]
};
 
var list=document.getElementById("itemList");
 
function send(key,value){
  window.parent.postMessage({type:"CARD_UPDATE",key:key,value:value},"*");
}
 
function renderText(){
  list.innerHTML="";
  var fields=[
    {key:"to",label:"Recipient",value:state.to,type:"input"},
    {key:"msg",label:"Message",value:state.msg,type:"textarea"},
    {key:"verse",label:"Verse / reference",value:state.verse,type:"input"},
    {key:"from",label:"From",value:state.from,type:"input"}
  ];
  fields.forEach(function(f){
    var item=document.createElement("div");item.className="item text-item";
    var box=document.createElement("div");box.className="text-box";
    var label=document.createElement("label");label.textContent=f.label;
    var input=document.createElement(f.type==="textarea"?"textarea":"input");
    input.value=f.value||"";input.maxLength=f.key==="msg"?220:40;
    input.oninput=function(){state[f.key]=input.value;send(f.key,input.value);};
    var save=document.createElement("button");save.className="text-save";save.type="button";save.textContent="Apply";
    save.onclick=function(){state[f.key]=input.value;send(f.key,input.value);};
    box.appendChild(label);box.appendChild(input);box.appendChild(save);
    if(f.key==="msg"){
      var slabel=document.createElement("label");slabel.textContent="Text box height";
      var wrap=document.createElement("div");wrap.className="slider-wrap";
      var slider=document.createElement("input");slider.type="range";slider.className="message-slider";
      slider.min="70";slider.max="210";slider.step="5";slider.value=state.messageHeight||110;
      var val=document.createElement("span");val.className="slider-value";val.textContent=slider.value+"px";
      slider.oninput=function(){state.messageHeight=Number(slider.value);val.textContent=slider.value+"px";window.parent.postMessage({type:"CARD_MESSAGE_HEIGHT",value:state.messageHeight},"*");};
      wrap.appendChild(slider);wrap.appendChild(val);box.appendChild(slabel);box.appendChild(wrap);
    }
    item.appendChild(box);list.appendChild(item);
  });
}
 
function renderVisual(category){
  list.innerHTML="";
 
  DATA[category].forEach(function(data){
    var item=document.createElement("div");
    item.className="item";
 
    var preview=document.createElement("div");
    preview.className="preview";
 
    if(category==="color"){
      var dot=document.createElement("div");
      dot.className="color-preview";
      dot.style.setProperty("--sw",data.color);
      preview.appendChild(dot);
    }else{
      preview.textContent=data.preview||data.value;
      if(category==="font")preview.classList.add(data.className);
    }
 
    var label=document.createElement("div");
    label.className="label";
    label.textContent=data.name;
 
    item.appendChild(preview);
    item.appendChild(label);
 
    var stateKey=category==="background"?"bg":category==="color"?"accent":category;
    if(state[stateKey]===data.value)item.classList.add("active");
 
    item.onclick=function(){
      state[stateKey]=data.value;
      Array.prototype.forEach.call(document.querySelectorAll(".item"),function(x){x.classList.remove("active")});
      item.classList.add("active");
      send(stateKey,data.value);
    };
 
    list.appendChild(item);
  });
}
 
var selectedPhotoId=null;
 
function getSelectedPhoto(){
  var photos=state.photos||[];
  if(!photos.length)return null;
  for(var i=0;i<photos.length;i++){if(photos[i].id===selectedPhotoId)return photos[i];}
  return photos[0];
}
 
function renderPhoto(){
  list.innerHTML="";
  var item=document.createElement("div");item.className="item text-item";
  var box=document.createElement("div");box.className="text-box";
  var label=document.createElement("label");label.textContent="Add up to 3 photos";box.appendChild(label);
  var input=document.createElement("input");input.className="photo-upload";input.type="file";input.accept="image/jpeg,image/png,image/webp";input.multiple=true;
  input.onchange=function(){
    var files=Array.prototype.slice.call(input.files||[]),remaining=3-(state.photos||[]).length;
    files.slice(0,Math.max(0,remaining)).forEach(function(file){
      if(!/^image\/(jpeg|png|webp)$/i.test(file.type)){alert(file.name+" is not a supported image.");return;}
      var reader=new FileReader();
      reader.onload=function(e){
        var im=new Image();
        im.onload=function(){
          var ratio=im.naturalWidth/im.naturalHeight||1;
          var id="photo-"+Date.now()+"-"+Math.random().toString(36).slice(2);
          window.parent.postMessage({type:"ADD_PHOTO",photo:{
            id:id,
            name:file.name,type:file.type,dataUrl:e.target.result,x:50,y:50,
            width:Math.min(180,Math.max(90,im.naturalWidth)),height:Math.min(180,Math.max(90,im.naturalHeight)),
            ratio:ratio,rotation:0
          }},"*");
          selectedPhotoId=id;
        };
        im.src=e.target.result;
      };
      reader.readAsDataURL(file);
    });
    input.value="";
  };
  box.appendChild(input);
  var note=document.createElement("div");note.className="menu-hint";note.textContent="Drag a photo on the card to reposition it, or tap a thumbnail below to select it. Use the corner handle on the card to resize.";
  box.appendChild(note);
 
  var photoList=document.createElement("div");photoList.className="photo-list";
  (state.photos||[]).forEach(function(photo){
    var thumb=document.createElement("div");thumb.className="photo-thumb"+(photo.id===(getSelectedPhoto()||{}).id?" active":"");
    var img=document.createElement("img");img.src=photo.dataUrl||photo.url;img.alt=photo.name||"Photo";thumb.appendChild(img);
    thumb.onclick=function(){
      selectedPhotoId=photo.id;
      window.parent.postMessage({type:"SELECT_PHOTO",id:photo.id},"*");
      renderPhoto();
    };
    var del=document.createElement("button");del.type="button";del.textContent="×";del.setAttribute("aria-label","Remove photo");
    del.onclick=function(e){e.stopPropagation();window.parent.postMessage({type:"REMOVE_PHOTO",id:photo.id},"*");};
    thumb.appendChild(del);photoList.appendChild(thumb);
  });
  box.appendChild(photoList);
 
  var p=getSelectedPhoto();
  if(p){
    var controls=document.createElement("div");controls.className="photo-controls";
 
    var sLab=document.createElement("label");sLab.innerHTML="<span>Size</span><span>"+Math.round((clampPhotoWidth(p.width||180))/180*100)+"%</span>";
    var slider=document.createElement("input");slider.type="range";slider.className="photo-slider";slider.min="60";slider.max="180";slider.step="5";
    slider.value=clampPhotoWidth(p.width||180);
    slider.oninput=function(){
      var w=Number(slider.value), ratio=Number(p.ratio)||1;
      p.width=w;p.height=Math.max(60,Math.min(320,Math.round(w/ratio)));
      sLab.lastChild.textContent=Math.round(w/180*100)+"%";
      window.parent.postMessage({type:"CARD_UPDATE_PHOTO",photo:p},"*");
    };
    controls.appendChild(sLab);controls.appendChild(slider);
 
    var rLab=document.createElement("label");rLab.innerHTML="<span>Rotate</span><span>"+(Number(p.rotation)||0)+"°</span>";
    var rSlider=document.createElement("input");rSlider.type="range";rSlider.className="photo-slider";rSlider.min="0";rSlider.max="360";rSlider.step="5";
    rSlider.value=Number(p.rotation)||0;
    rSlider.oninput=function(){
      p.rotation=Number(rSlider.value);
      rLab.lastChild.textContent=p.rotation+"°";
      window.parent.postMessage({type:"CARD_UPDATE_PHOTO",photo:p},"*");
    };
    controls.appendChild(rLab);controls.appendChild(rSlider);
 
    box.appendChild(controls);
  }
  var count=document.createElement("div");count.className="history-note";count.textContent=(state.photos||[]).length+" / 3 photos used.";
  box.appendChild(count);item.appendChild(box);list.appendChild(item);
}
function clampPhotoWidth(v){return Math.max(60,Math.min(180,Number(v)||180));}
 
function renderHistory(){
  list.innerHTML="";var item=document.createElement("div");item.className="item text-item";var box=document.createElement("div");box.className="text-box";
} 
function render(category){
  if(category==="text")renderText();
  else if(category==="photo")renderPhoto();
  else if(category==="history"){list.innerHTML="";var item=document.createElement("div");item.className="item text-item";var box=document.createElement("div");box.className="text-box";var note=document.createElement("div");note.className="history-note";note.textContent="Open your personal history to restore, edit, or delete saved creations.";var b=document.createElement("button");b.className="history-btn";b.type="button";b.textContent="Open History";b.onclick=function(){window.parent.postMessage({type:"OPEN_HISTORY"},"*")};box.appendChild(note);box.appendChild(b);item.appendChild(box);list.appendChild(item)}
  else renderVisual(category);
}
 
Array.prototype.forEach.call(document.querySelectorAll(".category"),function(btn){
  btn.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll(".category"),function(x){x.classList.remove("active")});
    btn.classList.add("active");
    render(btn.getAttribute("data-category"));
  };
});
 
window.addEventListener("message",function(event){
  if(!event.data)return;
  if(event.data.type==="CARD_UPDATE_PHOTO"&&event.data.photo){
  state.photos=state.photos||[];
  for(var i=0;i<state.photos.length;i++){if(state.photos[i].id===event.data.photo.id){state.photos[i]=event.data.photo;break;}}
  return;
}
if(event.data.type==="CARD_INIT"&&event.data.state){
    state=Object.assign(state,event.data.state);
    render(document.querySelector(".category.active").getAttribute("data-category"));
  }
  if(event.data.type==="PHOTO_SELECTED"){
    selectedPhotoId=event.data.id;
    if(document.querySelector(".category.active").getAttribute("data-category")==="photo")renderPhoto();
  }
});
 
render("text");
})();
</script>
</body>
</html>
