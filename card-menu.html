<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Petit+Formal+Script&display=swap" rel="stylesheet">
<style>
:root{--gold:#c99a3d;--gold-soft:#e3c988;--cream:#f4e8d9;--dim:#cdb2a6;--panel:#2a0a10}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:rgba(24,5,8,.96);color:var(--cream);overflow:hidden}.menu{height:100%;display:flex;flex-direction:column;border-top:1px solid rgba(201,154,61,.18);box-shadow:0 -12px 30px rgba(0,0,0,.18)}
.categories{height:50px;display:flex;align-items:center;justify-content:center;gap:3px;overflow-x:auto;scrollbar-width:none;padding:0 12px}.categories::-webkit-scrollbar{display:none}.category{border:0;background:transparent;color:var(--dim);font-size:12px;padding:8px 13px;border-radius:18px;cursor:pointer;white-space:nowrap}.category:hover{color:var(--gold-soft)}.category.active{background:rgba(201,154,61,.13);color:var(--gold-soft)}
.items{flex:1;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;padding:4px 22px 11px}.items::-webkit-scrollbar{display:none}.item-list{display:flex;gap:17px;margin:auto}.item{width:72px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;user-select:none}.preview{width:57px;height:57px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.045);border:1px solid rgba(201,154,61,.2);transition:.18s;font-size:25px;color:var(--cream)}.item:hover .preview{transform:translateY(-2px);border-color:var(--gold-soft)}.item.active .preview{border-color:var(--gold);background:rgba(201,154,61,.14);box-shadow:0 0 0 3px rgba(201,154,61,.07)}.label{font-size:10px;color:var(--dim);white-space:nowrap;max-width:72px;overflow:hidden;text-overflow:ellipsis;text-align:center}
.color-preview{width:34px;height:34px;border-radius:50%;background:var(--sw);border:2px solid rgba(255,255,255,.16)}.font-serif{font-family:'Cormorant Garamond',Georgia,serif;font-size:23px}.font-script{font-family:'Petit Formal Script',cursive;font-size:20px}.font-sans{font-family:Arial,sans-serif;font-size:15px}
.text-item{width:150px}.text-box{width:150px;display:flex;flex-direction:column;gap:4px}.text-box label{font-size:9px;color:var(--dim)}.text-box input,.text-box textarea{width:100%;border:1px solid rgba(201,154,61,.28);background:rgba(0,0,0,.22);color:var(--cream);border-radius:5px;padding:7px 8px;font-size:11px;outline:none}.text-box textarea{height:48px;resize:none}.text-box input:focus,.text-box textarea:focus{border-color:var(--gold)}.text-save{border:1px solid rgba(201,154,61,.45);background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#241012;border-radius:14px;padding:5px 9px;font-size:10px;font-weight:bold;cursor:pointer}
@media(max-width:700px){.categories{justify-content:flex-start}.item-list{margin-left:0}.items{padding-left:12px;padding-right:12px}.item{width:68px}.preview{width:52px;height:52px}}
</style>
</head>
<body>
<div class="menu">
  <div class="categories">
    <button class="category active" data-category="text">Message</button>
    <button class="category" data-category="symbol">Symbols</button>
    <button class="category" data-category="frame">Frames</button>
    <button class="category" data-category="background">Backgrounds</button>
    <button class="category" data-category="color">Colors</button>
    <button class="category" data-category="font">Lettering</button>
  </div>
  <div class="items"><div class="item-list" id="itemList"></div></div>
</div>

<script>
(function(){
"use strict";

var state={
  to:"Sister Grace",
  msg:"Thinking of you today — may the Lord renew your strength like the eagle's wings.",
  verse:"Isaiah 40:31",
  from:"Your Sunday School Class",
  symbol:"🕊️",
  frame:"frame-classic",
  bg:"bg-plain",
  accent:"gold",
  font:"font-serif"
};

var DATA={
symbol:[
{name:"Dove",value:"🕊️"},{name:"Cross",value:"✝️"},{name:"Flame",value:"🔥"},
{name:"Wheat",value:"🌾"},{name:"Candle",value:"🕯️"},{name:"Prayer",value:"🙏"},
{name:"Heart",value:"❤️"},{name:"Sunrise",value:"☀️"}
],
frame:[
{name:"Classic",value:"frame-classic",preview:"▣"},
{name:"Ornate",value:"frame-ornate",preview:"▤"},
{name:"Dashed",value:"frame-scallop",preview:"▧"},
{name:"Simple",value:"frame-simple",preview:"□"}
],
background:[
{name:"Plain",value:"bg-plain",preview:"○"},
{name:"Rays",value:"bg-rays",preview:"☀"},
{name:"Dotted",value:"bg-dots",preview:"⠿"},
{name:"Woven",value:"bg-weave",preview:"▦"}
],
color:[
{name:"Gold",value:"gold",color:"#c99a3d"},
{name:"Rose",value:"rose",color:"#c97b8c"},
{name:"Ember",value:"ember",color:"#b4522f"},
{name:"Dawn",value:"dawn",color:"#8fa6c9"}
],
font:[
{name:"Serif",value:"font-serif",preview:"Aa",className:"font-serif"},
{name:"Script",value:"font-script",preview:"Aa",className:"font-script"},
{name:"Sans",value:"font-sans",preview:"Aa",className:"font-sans"}
]
};

var list=document.getElementById("itemList");

function send(key,value){
  window.parent.postMessage({type:"CARD_UPDATE",key:key,value:value},"*");
}

function renderText(){
  list.innerHTML="";
  var fields=[
    {key:"to",label:"Recipient",value:state.to,type:"input"},
    {key:"msg",label:"Message",value:state.msg,type:"textarea"},
    {key:"verse",label:"Verse / reference",value:state.verse,type:"input"},
    {key:"from",label:"From",value:state.from,type:"input"}
  ];

  fields.forEach(function(f){
    var item=document.createElement("div");
    item.className="item text-item";

    var box=document.createElement("div");
    box.className="text-box";

    var label=document.createElement("label");
    label.textContent=f.label;

    var input=document.createElement(f.type==="textarea"?"textarea":"input");
    input.value=f.value||"";
    input.maxLength=f.key==="msg"?220:40;

    var save=document.createElement("button");
    save.className="text-save";
    save.type="button";
    save.textContent="Apply";

    save.onclick=function(){
      send(f.key,input.value);
      state[f.key]=input.value;
    };

    box.appendChild(label);
    box.appendChild(input);
    box.appendChild(save);
    item.appendChild(box);
    list.appendChild(item);
  });
}

function renderVisual(category){
  list.innerHTML="";

  DATA[category].forEach(function(data){
    var item=document.createElement("div");
    item.className="item";

    var preview=document.createElement("div");
    preview.className="preview";

    if(category==="color"){
      var dot=document.createElement("div");
      dot.className="color-preview";
      dot.style.setProperty("--sw",data.color);
      preview.appendChild(dot);
    }else{
      preview.textContent=data.preview||data.value;
      if(category==="font")preview.classList.add(data.className);
    }

    var label=document.createElement("div");
    label.className="label";
    label.textContent=data.name;

    item.appendChild(preview);
    item.appendChild(label);

    var stateKey=category==="background"?"bg":category==="color"?"accent":category;
    if(state[stateKey]===data.value)item.classList.add("active");

    item.onclick=function(){
      state[stateKey]=data.value;
      Array.prototype.forEach.call(document.querySelectorAll(".item"),function(x){x.classList.remove("active")});
      item.classList.add("active");
      send(stateKey,data.value);
    };

    list.appendChild(item);
  });
}

function render(category){
  if(category==="text")renderText();
  else renderVisual(category);
}

Array.prototype.forEach.call(document.querySelectorAll(".category"),function(btn){
  btn.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll(".category"),function(x){x.classList.remove("active")});
    btn.classList.add("active");
    render(btn.getAttribute("data-category"));
  };
});

window.addEventListener("message",function(event){
  if(!event.data)return;
  if(event.data.type==="CARD_INIT"&&event.data.state){
    state=Object.assign(state,event.data.state);
    render(document.querySelector(".category.active").getAttribute("data-category"));
  }
});

render("text");
})();
</script>
</body>
</html>
