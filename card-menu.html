<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Design Your Blessing</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --maroon: #651525;
      --maroon-dark: #48101b;

      --gold: #c89b3c;
      --gold-light: #ead18b;

      --cream: #fffaf2;
      --paper: #ffffff;

      --ink: #2c2020;
      --muted: #756767;

      --line: #eadfd6;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      background: #ffffff;

      color: var(--ink);

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      padding: 20px;
    }

    .section {
      margin-bottom: 20px;

      background: white;

      border: 1px solid var(--line);

      border-radius: 13px;

      overflow: hidden;
    }

    .section-title {
      padding: 14px 16px;

      background: #fffaf7;

      border-bottom: 1px solid var(--line);

      color: var(--maroon);

      font-size: 15px;

      font-weight: 700;
    }

    .section-body {
      padding: 16px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: var(--ink);

      font-size: 12px;

      font-weight: 700;
    }

    input,
    textarea,
    select {
      width: 100%;

      border: 1px solid var(--line);

      border-radius: 8px;

      background: white;

      color: var(--ink);

      font: inherit;

      outline: none;
    }

    input,
    select {
      min-height: 40px;

      padding: 9px 11px;
    }

    textarea {
      min-height: 180px;

      resize: vertical;

      padding: 11px;

      line-height: 1.55;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--gold);

      box-shadow:
        0 0 0 2px rgba(200,155,60,.10);
    }

    .two-column {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;
    }

    .three-column {
      display: grid;

      grid-template-columns:
        1fr 1fr 1fr;

      gap: 10px;
    }

    .preset-row {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-top: 9px;
    }

    .preset {
      border: 1px solid var(--line);

      background: #fffaf7;

      color: var(--maroon);

      border-radius: 7px;

      padding: 7px 10px;

      font-size: 11px;

      cursor: pointer;
    }

    .preset:hover {
      border-color: var(--gold);

      background: #fff6e8;
    }

    /* =========================
       PHOTO UPLOAD
    ========================= */

    .upload-box {
      border: 2px dashed #dbc9bd;

      border-radius: 11px;

      padding: 20px;

      text-align: center;

      background: #fffdfb;

      cursor: pointer;

      transition: .15s;
    }

    .upload-box:hover {
      border-color: var(--gold);

      background: #fffaf2;
    }

    .upload-icon {
      font-size: 27px;

      margin-bottom: 7px;
    }

    .upload-title {
      font-size: 13px;

      font-weight: 700;

      color: var(--maroon);
    }

    .upload-note {
      margin-top: 5px;

      color: var(--muted);

      font-size: 11px;
    }

    #photoInput {
      display: none;
    }

    .photo-list {
      margin-top: 13px;

      display: grid;

      gap: 9px;
    }

    .photo-item {
      display: flex;

      align-items: center;

      gap: 10px;

      padding: 9px;

      background: #fffaf7;

      border: 1px solid var(--line);

      border-radius: 9px;
    }

    .photo-thumb {
      width: 58px;
      height: 58px;

      flex: 0 0 58px;

      border-radius: 7px;

      overflow: hidden;

      background: #eee;

      border: 1px solid var(--line);
    }

    .photo-thumb img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .photo-info {
      min-width: 0;

      flex: 1;
    }

    .photo-name {
      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 12px;

      font-weight: 700;
    }

    .photo-note {
      margin-top: 3px;

      font-size: 10px;

      color: var(--muted);
    }

    .photo-delete {
      border: 0;

      background: transparent;

      color: #9c3b3b;

      font-size: 18px;

      cursor: pointer;

      padding: 5px;
    }

    /* =========================
       DESIGN
    ========================= */

    .color-row {
      display: grid;

      grid-template-columns:
        1fr 60px;

      gap: 8px;

      align-items: center;
    }

    input[type="color"] {
      width: 60px;

      height: 40px;

      padding: 3px;

      cursor: pointer;
    }

    .design-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;
    }

    .design-full {
      grid-column: 1 / -1;
    }

    .color-preview {
      height: 10px;

      margin-top: 7px;

      border-radius: 10px;

      border: 1px solid var(--line);
    }

    .info-box {
      margin-top: 12px;

      padding: 11px 12px;

      border-radius: 8px;

      background: #fff8e9;

      border: 1px solid #efdfb7;

      color: #6b5527;

      font-size: 11px;

      line-height: 1.5;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      .two-column,
      .three-column,
      .design-grid {
        grid-template-columns: 1fr;
      }

      .design-full {
        grid-column: auto;
      }
    }

  </style>

</head>

<body>


<!-- =====================================================
     BLESSING DETAILS
===================================================== -->

<section class="section">

  <div class="section-title">
    Blessing Details
  </div>

  <div class="section-body">

    <div class="field">

      <label for="title">
        Card Title
      </label>

      <input
        id="title"
        type="text"
        value="A Blessing For You"
        maxlength="80">

    </div>


    <div class="two-column">

      <div class="field">

        <label for="to">
          To
        </label>

        <input
          id="to"
          type="text"
          value="YSL"
          maxlength="60">

      </div>


      <div class="field">

        <label for="from">
          From
        </label>

        <input
          id="from"
          type="text"
          value="KIM"
          maxlength="60">

      </div>

    </div>

  </div>

</section>


<!-- =====================================================
     MESSAGE
===================================================== -->

<section class="section">

  <div class="section-title">
    Message
  </div>

  <div class="section-body">

    <div class="field">

      <label for="message">
        Your Blessing Message
      </label>

      <textarea
        id="message"
        placeholder="Write your blessing here..."></textarea>


      <div class="preset-row">

        <button
          class="preset"
          type="button"
          onclick="usePreset('blessing')">
          Blessing
        </button>

        <button
          class="preset"
          type="button"
          onclick="usePreset('love')">
          Love
        </button>

        <button
          class="preset"
          type="button"
          onclick="usePreset('faith')">
          Faith
        </button>

      </div>

    </div>

  </div>

</section>


<!-- =====================================================
     PHOTOS
===================================================== -->

<section class="section">

  <div class="section-title">
    Photos
  </div>

  <div class="section-body">

    <label
      class="upload-box"
      for="photoInput">

      <div class="upload-icon">
        🖼️
      </div>

      <div class="upload-title">
        Add Photos
      </div>

      <div class="upload-note">
        Upload your photos here.
        You can edit, move, resize, rotate,
        and crop them directly in the
        Finished Card Preview.
      </div>

    </label>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      multiple>


    <div
      id="photoList"
      class="photo-list">
    </div>

  </div>

</section>


<!-- =====================================================
     DESIGN
===================================================== -->

<section class="section">

  <div class="section-title">
    Design
  </div>

  <div class="section-body">

    <div class="design-grid">


      <!-- SYMBOL -->

      <div class="field">

        <label for="symbol">
          Symbol
        </label>

        <select id="symbol">

          <option value="✝">
            Cross
          </option>

          <option value="☦">
            Orthodox Cross
          </option>

          <option value="✚">
            Cross Plus
          </option>

          <option value="🕊">
            Dove
          </option>

          <option value="♥">
            Heart
          </option>

          <option value="✦">
            Star
          </option>

          <option value="❦">
            Floral
          </option>

          <option value="✧">
            Light Star
          </option>

          <option value="">
            None
          </option>

        </select>

      </div>


      <!-- FONT -->

      <div class="field">

        <label for="font">
          Font
        </label>

        <select id="font">

          <option value="Georgia">
            Georgia
          </option>

          <option value="Palatino Linotype">
            Palatino Linotype
          </option>

          <option value="Book Antiqua">
            Book Antiqua
          </option>

          <option value="Times New Roman">
            Times New Roman
          </option>

          <option value="Garamond">
            Garamond
          </option>

          <option value="Arial">
            Arial
          </option>

          <option value="Verdana">
            Verdana
          </option>

          <option value="Trebuchet MS">
            Trebuchet MS
          </option>

          <option value="Segoe UI">
            Segoe UI
          </option>

          <option value="Century Gothic">
            Century Gothic
          </option>

          <option value="Courier New">
            Courier New
          </option>

          <option value="Lucida Handwriting">
            Lucida Handwriting
          </option>

        </select>

      </div>


      <!-- TEXTURE -->

      <div class="field design-full">

        <label for="texture">
          Background Design / Texture
        </label>

        <select id="texture">

          <option>
            Dotted Sun Rays
          </option>

          <option>
            Radiant Dot Pattern
          </option>

          <option>
            Sacred Halftone Rays
          </option>

          <option>
            Soft Ray Lines
          </option>

          <option>
            Divine Light Texture
          </option>

          <option>
            Minimal Sunburst
          </option>

          <option>
            Golden Ray Grid
          </option>

          <option>
            Subtle Radiance
          </option>

          <option>
            Ethereal Dot Rays
          </option>

          <option>
            Sacred Light Lines
          </option>

          <option>
            Fine Dotted Rays
          </option>

          <option>
            Glowing Sunburst
          </option>

          <option>
            Minimal Divine Rays
          </option>

          <option>
            Light Beam Texture
          </option>

          <option>
            Elegant Ray Pattern
          </option>

        </select>

      </div>


      <!-- TEXTURE COLOR -->

      <div class="field">

        <label for="textureColor">
          Texture Color
        </label>

        <div class="color-row">

          <input
            id="textureColorText"
            type="text"
            value="#C89B3C"
            maxlength="7"
            aria-label="Texture color hex">

          <input
            id="textureColor"
            type="color"
            value="#C89B3C">

        </div>

        <div
          id="textureColorPreview"
          class="color-preview">
        </div>

      </div>


      <!-- BORDER COLOR -->

      <div class="field">

        <label for="borderColor">
          Border Color
        </label>

        <div class="color-row">

          <input
            id="borderColorText"
            type="text"
            value="#C89B3C"
            maxlength="7"
            aria-label="Border color hex">

          <input
            id="borderColor"
            type="color"
            value="#C89B3C">

        </div>

        <div
          id="borderColorPreview"
          class="color-preview">
        </div>

      </div>


      <!-- INNER BORDER -->

      <div class="field">

        <label for="innerBorder">
          Second / Inner Border
        </label>

        <select id="innerBorder">

          <option value="fine">
            Fine Line
          </option>

          <option value="double">
            Double Line
          </option>

          <option value="dotted">
            Dotted
          </option>

          <option value="dashed">
            Dashed
          </option>

          <option value="elegant">
            Elegant Rounded
          </option>

          <option value="none">
            None
          </option>

        </select>

      </div>


      <!-- FONT COLOR -->

      <div class="field">

        <label for="fontColor">
          Font Color
        </label>

        <div class="color-row">

          <input
            id="fontColorText"
            type="text"
            value="#4C0A16"
            maxlength="7"
            aria-label="Font color hex">

          <input
            id="fontColor"
            type="color"
            value="#4C0A16">

        </div>

        <div
          id="fontColorPreview"
          class="color-preview">
        </div>

      </div>

    </div>


    <div class="info-box">

      <strong>Photo editing:</strong>
      Photos are uploaded from this menu.
      After uploading, select a photo in the
      Finished Card Preview to move, resize,
      rotate, or crop it.

    </div>

  </div>

</section>


<script>

  /* =========================================================
     STATE
  ========================================================= */

  let state = {

    title:
      "A Blessing For You",

    to:
      "YSL",

    recipient:
      "YSL",

    from:
      "KIM",

    msg:
      "",

    message:
      "",

    photos:
      [],

    symbol:
      "✝",

    texture:
      "Dotted Sun Rays",

    textureColor:
      "#C89B3C",

    borderColor:
      "#C89B3C",

    innerBorder:
      "fine",

    fontColor:
      "#4C0A16",

    font:
      "Georgia"

  };


  /* =========================================================
     PRESETS
  ========================================================= */

  const presets = {

    blessing:
      "May this blessing remind you that you are loved, guided, and never alone.\n\nMay God continue to bless you, strengthen your faith, and guide you in every step of your journey.",

    love:
      "May you always be reminded that you are loved, valued, and cared for.\n\nMay God's love remain with you today and always.",

    faith:
      "May your faith remain strong even during difficult moments.\n\nTrust in God's plan, keep praying, and remember that He is always with you."

  };


  function usePreset(type) {

    const message =
      presets[type] || "";

    document.getElementById(
      "message"
    ).value = message;

    state.msg =
      message;

    state.message =
      message;

    sendState();
  }


  /* =========================================================
     DOM
  ========================================================= */

  const titleInput =
    document.getElementById("title");

  const toInput =
    document.getElementById("to");

  const fromInput =
    document.getElementById("from");

  const messageInput =
    document.getElementById("message");

  const symbolInput =
    document.getElementById("symbol");

  const textureInput =
    document.getElementById("texture");

  const fontInput =
    document.getElementById("font");

  const innerBorderInput =
    document.getElementById("innerBorder");

  const textureColor =
    document.getElementById("textureColor");

  const textureColorText =
    document.getElementById("textureColorText");

  const borderColor =
    document.getElementById("borderColor");

  const borderColorText =
    document.getElementById("borderColorText");

  const fontColor =
    document.getElementById("fontColor");

  const fontColorText =
    document.getElementById("fontColorText");

  const photoInput =
    document.getElementById("photoInput");

  const photoList =
    document.getElementById("photoList");


  /* =========================================================
     INPUT EVENTS
  ========================================================= */

  titleInput.addEventListener(
    "input",
    () => {

      state.title =
        titleInput.value;

      sendState();
    }
  );


  toInput.addEventListener(
    "input",
    () => {

      state.to =
        toInput.value;

      state.recipient =
        toInput.value;

      sendState();
    }
  );


  fromInput.addEventListener(
    "input",
    () => {

      state.from =
        fromInput.value;

      sendState();
    }
  );


  messageInput.addEventListener(
    "input",
    () => {

      state.msg =
        messageInput.value;

      state.message =
        messageInput.value;

      sendState();
    }
  );


  symbolInput.addEventListener(
    "change",
    () => {

      state.symbol =
        symbolInput.value || "";

      sendState();
    }
  );


  textureInput.addEventListener(
    "change",
    () => {

      state.texture =
        textureInput.value;

      sendState();
    }
  );


  fontInput.addEventListener(
    "change",
    () => {

      state.font =
        fontInput.value;

      sendState();
    }
  );


  innerBorderInput.addEventListener(
    "change",
    () => {

      state.innerBorder =
        innerBorderInput.value;

      sendState();
    }
  );


  /* =========================================================
     COLOR HELPERS
  ========================================================= */

  function validHex(value) {

    return /^#[0-9A-Fa-f]{6}$/.test(
      value
    );
  }


  function syncColor(
    colorInput,
    textInput,
    property
  ) {

    colorInput.addEventListener(
      "input",
      () => {

        const value =
          colorInput.value;

        textInput.value =
          value.toUpperCase();

        state[property] =
          value;

        updateColorPreview(
          property,
          value
        );

        sendState();
      }
    );


    textInput.addEventListener(
      "input",
      () => {

        let value =
          textInput.value.trim();

        if (
          !value.startsWith("#")
        ) {
          value =
            "#" + value;
        }

        if (
          validHex(value)
        ) {

          value =
            value.toUpperCase();

          colorInput.value =
            value;

          state[property] =
            value;

          updateColorPreview(
            property,
            value
          );

          sendState();
        }
      }
    );
  }


  function updateColorPreview(
    property,
    value
  ) {

    let element;

    if (
      property === "textureColor"
    ) {
      element =
        document.getElementById(
          "textureColorPreview"
        );
    }

    if (
      property === "borderColor"
    ) {
      element =
        document.getElementById(
          "borderColorPreview"
        );
    }

    if (
      property === "fontColor"
    ) {
      element =
        document.getElementById(
          "fontColorPreview"
        );
    }

    if (element) {
      element.style.background =
        value;
    }
  }


  syncColor(
    textureColor,
    textureColorText,
    "textureColor"
  );

  syncColor(
    borderColor,
    borderColorText,
    "borderColor"
  );

  syncColor(
    fontColor,
    fontColorText,
    "fontColor"
  );


  /* =========================================================
     PHOTO UPLOAD
  ========================================================= */

  photoInput.addEventListener(
    "change",
    async event => {

      const files =
        Array.from(
          event.target.files || []
        );

      for (const file of files) {

        if (
          !file.type.startsWith("image/")
        ) {
          continue;
        }

        try {

          const dataUrl =
            await readFile(file);

          const photo = {

            id:
              "photo_" +
              Date.now() +
              "_" +
              Math.random()
                .toString(36)
                .slice(2, 8),

            name:
              file.name,

            fileName:
              file.name,

            mimeType:
              file.type,

            dataUrl:
              dataUrl,

            url:
              dataUrl,

            x:
              50,

            y:
              50,

            width:
              150,

            height:
              110,

            rotation:
              0,

            cropZoom:
              1,

            cropX:
              50,

            cropY:
              50

          };

          state.photos.push(
            photo
          );

          sendPhotoAdded(
            photo
          );

        } catch (error) {

          console.error(
            "Photo upload failed:",
            error
          );
        }
      }

      photoInput.value = "";

      renderPhotoList();

      sendState();
    }
  );


  function readFile(file) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();

        reader.onload =
          () => resolve(
            reader.result
          );

        reader.onerror =
          reject;

        reader.readAsDataURL(
          file
        );
      }
    );
  }


  /* =========================================================
     PHOTO LIST
  ========================================================= */

  function renderPhotoList() {

    photoList.innerHTML = "";

    state.photos.forEach(
      (photo, index) => {

        const item =
          document.createElement("div");

        item.className =
          "photo-item";

        const thumb =
          document.createElement("div");

        thumb.className =
          "photo-thumb";

        const image =
          document.createElement("img");

        image.src =
          photo.dataUrl ||
          photo.url ||
          "";

        thumb.appendChild(
          image
        );


        const info =
          document.createElement("div");

        info.className =
          "photo-info";

        const name =
          document.createElement("div");

        name.className =
          "photo-name";

        name.textContent =
          photo.name ||
          photo.fileName ||
          `Photo ${index + 1}`;


        const note =
          document.createElement("div");

        note.className =
          "photo-note";

        note.textContent =
          "Edit in Finished Card Preview";


        info.append(
          name,
          note
        );


        const deleteButton =
          document.createElement("button");

        deleteButton.type =
          "button";

        deleteButton.className =
          "photo-delete";

        deleteButton.title =
          "Remove photo";

        deleteButton.textContent =
          "×";

        deleteButton.addEventListener(
          "click",
          () => removePhoto(photo.id)
        );


        item.append(
          thumb,
          info,
          deleteButton
        );

        photoList.appendChild(
          item
        );
      }
    );
  }


  function removePhoto(id) {

    state.photos =
      state.photos.filter(
        photo =>
          photo.id !== id
      );

    window.parent.postMessage(
      {
        type:
          "REMOVE_PHOTO",

        photoId:
          id
      },
      "*"
    );

    sendState();

    renderPhotoList();
  }


  function sendPhotoAdded(photo) {

    window.parent.postMessage(
      {
        type:
          "ADD_PHOTO",

        photo:
          photo
      },
      "*"
    );
  }


  /* =========================================================
     STATE COMMUNICATION
  ========================================================= */

  function sendState() {

    normalizeAliases();

    window.parent.postMessage(
      {
        type:
          "CARD_STATE",

        state:
          {
            ...state,
            /*
              Theme intentionally removed.
            */
            theme:
              undefined
          }
      },
      "*"
    );

    window.parent.postMessage(
      {
        type:
          "CARD_UPDATE",

        state:
          {
            ...state
          }
      },
      "*"
    );
  }


  function normalizeAliases() {

    state.to =
      state.to ||
      state.recipient ||
      "YSL";

    state.recipient =
      state.recipient ||
      state.to ||
      "YSL";

    state.msg =
      state.msg ??
      state.message ??
      "";

    state.message =
      state.message ??
      state.msg ??
      "";
  }


  /* =========================================================
     LOAD STATE FROM BUILDER
  ========================================================= */

  window.addEventListener(
    "message",
    event => {

      const data =
        event.data;

      if (!data) {
        return;
      }

      if (
        data.type === "CARD_INIT" ||
        data.type === "LOAD_STATE" ||
        data.type === "INIT"
      ) {

        if (data.state) {
          loadState(
            data.state
          );
        }

        return;
      }


      if (
        data.type === "GET_STATE"
      ) {

        sendState();

        return;
      }


      if (
        data.type === "REMOVE_PHOTO"
      ) {

        const id =
          data.photoId ||
          data.id;

        state.photos =
          state.photos.filter(
            photo =>
              photo.id !== id
          );

        renderPhotoList();

        sendState();

        return;
      }


      /*
        Builder may return a photo update after
        editing directly in the finished preview.
      */
      if (
        data.type === "CARD_UPDATE_PHOTO"
      ) {

        const incoming =
          data.photo ||
          data;

        const id =
          incoming.id ||
          incoming.photoId;

        const index =
          state.photos.findIndex(
            photo =>
              photo.id === id
          );

        if (index !== -1) {

          state.photos[index] = {
            ...state.photos[index],
            ...incoming
          };

          renderPhotoList();
        }

        return;
      }

    }
  );


  function loadState(input) {

    if (
      !input ||
      typeof input !== "object"
    ) {
      return;
    }

    state = {

      ...state,

      ...input,

      /*
        Never bring back the old theme
        selector/state as an active design setting.
      */
      theme:
        undefined
    };


    state.title =
      state.title ||
      "A Blessing For You";

    state.to =
      state.to ||
      state.recipient ||
      "YSL";

    state.recipient =
      state.recipient ||
      state.to ||
      "YSL";

    state.from =
      state.from ||
      "KIM";

    state.msg =
      state.msg ??
      state.message ??
      "";

    state.message =
      state.message ??
      state.msg ??
      "";

    state.photos =
      Array.isArray(state.photos)
        ? state.photos
        : [];

    state.symbol =
      state.symbol ||
      "✝";

    state.texture =
      state.texture ||
      "Dotted Sun Rays";

    state.textureColor =
      state.textureColor ||
      "#C89B3C";

    state.borderColor =
      state.borderColor ||
      "#C89B3C";

    state.innerBorder =
      state.innerBorder ||
      "fine";

    state.fontColor =
      state.fontColor ||
      "#4C0A16";

    state.font =
      state.font ||
      "Georgia";


    /*
      Update form.
    */

    titleInput.value =
      state.title;

    toInput.value =
      state.to;

    fromInput.value =
      state.from;

    messageInput.value =
      state.msg;

    symbolInput.value =
      state.symbol;

    textureInput.value =
      state.texture;

    fontInput.value =
      state.font;

    innerBorderInput.value =
      state.innerBorder;


    setColorValue(
      textureColor,
      textureColorText,
      state.textureColor
    );

    setColorValue(
      borderColor,
      borderColorText,
      state.borderColor
    );

    setColorValue(
      fontColor,
      fontColorText,
      state.fontColor
    );


    renderPhotoList();

    updateColorPreview(
      "textureColor",
      state.textureColor
    );

    updateColorPreview(
      "borderColor",
      state.borderColor
    );

    updateColorPreview(
      "fontColor",
      state.fontColor
    );
  }


  function setColorValue(
    colorInput,
    textInput,
    value
  ) {

    if (
      !validHex(value)
    ) {
      value =
        "#C89B3C";
    }

    colorInput.value =
      value;

    textInput.value =
      value.toUpperCase();
  }


  /* =========================================================
     INITIAL COLOR PREVIEWS
  ========================================================= */

  updateColorPreview(
    "textureColor",
    state.textureColor
  );

  updateColorPreview(
    "borderColor",
    state.borderColor
  );

  updateColorPreview(
    "fontColor",
    state.fontColor
  );


  /* =========================================================
     READY
  ========================================================= */

  window.parent.postMessage(
    {
      type:
        "EDITOR_READY"
    },
    "*"
  );


  /*
    Send the initial state as well.
  */
  setTimeout(
    sendState,
    100
  );

</script>

</body>
</html>
