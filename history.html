<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal History — A Blessing to Share</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--deep:#2a0a10;--mid:#421119;--panel:#3a0f16;--gold:#c99a3d;--soft:#e3c988;--cream:#f4e8d9;--dim:#cdb2a6;--line:#6e2530}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Work Sans',sans-serif;background:radial-gradient(circle at 50% 10%,#4a1820,#2a0a10 55%,#180508);color:var(--cream);overflow-x:hidden}.wrap{max-width:1180px;margin:auto;padding:26px 22px 60px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:26px}.head h1{font-family:'Cormorant Garamond',serif;font-size:2.4rem;color:var(--soft);margin:0}.head a,.btn{border:1px solid rgba(201,154,61,.35);background:rgba(42,10,16,.7);color:var(--cream);text-decoration:none;padding:9px 14px;border-radius:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}.empty{padding:50px 20px;text-align:center;color:var(--dim);border:1px dashed rgba(201,154,61,.25);border-radius:10px}.card{background:rgba(58,15,22,.86);border:1px solid rgba(201,154,61,.2);border-radius:10px;padding:13px;box-shadow:0 16px 35px rgba(0,0,0,.25)}.preview{height:270px;display:flex;align-items:center;justify-content:center;background:#241012;border-radius:7px;overflow:hidden}.preview img{max-width:100%;max-height:100%;object-fit:contain}.mini-card{width:175px;height:238px;padding:18px 14px;border:1px solid var(--gold);background:linear-gradient(165deg,#3a0f16,#421119);text-align:center;display:flex;flex-direction:column;justify-content:space-between;font-family:'Cormorant Garamond',serif}.mini-msg{font-size:15px;line-height:1.35}.meta{padding:10px 2px}.meta strong{color:var(--soft)}.meta small{color:var(--dim)}.actions{display:flex;gap:7px}.actions button{flex:1;border:1px solid rgba(201,154,61,.35);background:rgba(0,0,0,.18);color:var(--cream);padding:8px;border-radius:6px}.actions button:first-child{background:linear-gradient(180deg,var(--soft),var(--gold));color:#241012;border:0}.danger{color:#f0b0b0!important}@media(max-width:600px){.head{align-items:flex-start;flex-direction:column}.head h1{font-size:2rem}.grid{grid-template-columns:1fr}.preview{height:310px}}
</style></head><body><main class="wrap"><header class="head"><h1>Personal History</h1><a href="card-builder.html">Create a card</a></header><div id="status" class="empty">Loading your saved creations…</div><section class="grid" id="grid"></section></main><script src="config.js"></script><script>
(function(){var API=window.YSL_API_URL||"";function id(k){var v=localStorage.getItem(k);if(!v){v=crypto.randomUUID?crypto.randomUUID():k+Date.now()+Math.random();localStorage.setItem(k,v)}return v}var uid=id('yslBlessingUserId'),key=id('yslBlessingUserKey'),status=document.getElementById('status'),grid=document.getElementById('grid');function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}function mini(st){var p=(st.photos&&st.photos[0]);var photo=p&&(p.url||p.dataUrl);return '<div class="mini-card">'+(photo?'<img src="'+esc(photo)+'" style="width:100%;height:90px;object-fit:cover">':'<div style="font-size:25px">'+esc(st.symbol||'🕊️')+'</div>')+'<div>For '+esc(st.to||'a friend')+'</div><div class="mini-msg">'+esc(st.msg||'')+'</div><small>'+esc(st.verse||'')+'</small><div>— '+esc(st.from||'')+'</div></div>'}function render(items){status.style.display=items.length?'none':'block';grid.innerHTML='';items.forEach(function(x){var st=x.state||{};var c=document.createElement('article');c.className='card';c.innerHTML='<div class="preview">'+mini(st)+'</div><div class="meta"><strong>'+esc(st.to||'Blessing card')+'</strong><br><small>Updated '+new Date(x.updatedAt||x.createdAt).toLocaleString()+' • '+((st.photos||[]).length)+' photo(s)</small></div><div class="actions"><button>Edit</button><button class="danger">Delete</button></div>';c.querySelector('button').onclick=function(){location.href='card-builder.html?edit=1#id='+encodeURIComponent(x.id)};c.querySelectorAll('button')[1].onclick=function(){if(confirm('Are you sure you want to delete this creation?\n\nThis action cannot be undone.'))post({action:'delete',userId:uid,userKey:key,creationId:x.id},function(){c.remove();if(!grid.children.length)status.style.display='block'})};grid.appendChild(c)})}function jsonp(){var cb='hist_'+Date.now();window[cb]=function(d){if(d&&d.ok)render(d.items||[]);else{status.textContent='Could not load history.'}var s=document.getElementById(cb);if(s)s.remove();delete window[cb]};var sc=document.createElement('script');sc.id=cb;sc.src=API+'?action=getHistory&userId='+encodeURIComponent(uid)+'&userKey='+encodeURIComponent(key)+'&callback='+cb;sc.onerror=function(){status.textContent='Could not connect to history service.';sc.remove();delete window[cb]};document.body.appendChild(sc)}function post(fields,done){var f=document.createElement('form');f.method='POST';f.action=API;f.target='histFrame';f.style.display='none';Object.keys(fields).forEach(function(k){var i=document.createElement('input');i.type='hidden';i.name=k;i.value=fields[k];f.appendChild(i)});document.body.appendChild(f);f.submit();setTimeout(function(){f.remove();if(done)done()},700)}var fr=document.createElement('iframe');fr.name='histFrame';fr.hidden=true;document.body.appendChild(fr);jsonp()})();</script></body></html>
