<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal History — A Blessing to Share</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&family=Petit+Formal+Script&display=swap" rel="stylesheet"><style>
:root{--deep:#2a0a10;--mid:#421119;--panel:#3a0f16;--gold:#c99a3d;--soft:#e3c988;--cream:#f4e8d9;--dim:#cdb2a6;--line:#6e2530;--font-display:'Cormorant Garamond',Georgia,serif;--font-script:'Petit Formal Script',cursive;--font-ui:'Work Sans',sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Work Sans',sans-serif;background:radial-gradient(circle at 50% 10%,#4a1820,#2a0a10 55%,#180508);color:var(--cream);overflow-x:hidden}.wrap{max-width:1180px;margin:auto;padding:26px 22px 60px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:26px}.head h1{font-family:'Cormorant Garamond',serif;font-size:2.4rem;color:var(--soft);margin:0}.head a,.btn{border:1px solid rgba(201,154,61,.35);background:rgba(42,10,16,.7);color:var(--cream);text-decoration:none;padding:9px 14px;border-radius:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}.empty{padding:50px 20px;text-align:center;color:var(--dim);border:1px dashed rgba(201,154,61,.25);border-radius:10px}.card{background:rgba(58,15,22,.86);border:1px solid rgba(201,154,61,.2);border-radius:10px;padding:13px;box-shadow:0 16px 35px rgba(0,0,0,.25)}.preview{height:270px;display:flex;align-items:center;justify-content:center;background:#241012;border-radius:7px;overflow:hidden;position:relative}.preview-stage{position:relative;width:340px;height:460px;flex:none}.meta{padding:10px 2px}.meta strong{color:var(--soft)}.meta small{color:var(--dim)}.actions{display:flex;gap:7px}.actions button{flex:1;border:1px solid rgba(201,154,61,.35);background:rgba(0,0,0,.18);color:var(--cream);padding:8px;border-radius:6px}.actions button:first-child{background:linear-gradient(180deg,var(--soft),var(--gold));color:#241012;border:0}.danger{color:#f0b0b0!important}@media(max-width:600px){.head{align-items:flex-start;flex-direction:column}.head h1{font-size:2rem}.grid{grid-template-columns:1fr}.preview{height:310px}}
 
/* ---- Real blessing-card preview (mirrors card-builder.html) ---- */
.blessing-card{position:relative;width:340px;min-height:460px;height:460px;background:linear-gradient(165deg,var(--panel),var(--mid));border:1px solid var(--card-line,var(--gold));border-radius:2px;padding:30px 26px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 20px 45px rgba(0,0,0,.4);overflow:hidden}
.card-layer-bg{position:absolute;inset:0;pointer-events:none;opacity:.55}
.bg-plain .card-layer-bg{background:none}
.bg-rays .card-layer-bg{background:repeating-conic-gradient(from 0deg at 50% 0%,rgba(201,154,61,.10) 0deg 6deg,transparent 6deg 16deg)}
.bg-dots .card-layer-bg{background-image:radial-gradient(var(--card-line,var(--gold)) 1px,transparent 1.4px);background-size:16px 16px;opacity:.28}
.bg-weave .card-layer-bg{background-image:linear-gradient(45deg,rgba(201,154,61,.10) 25%,transparent 25%,transparent 75%,rgba(201,154,61,.10) 75%),linear-gradient(-45deg,rgba(201,154,61,.10) 25%,transparent 25%,transparent 75%,rgba(201,154,61,.10) 75%);background-size:18px 18px}
.frame-classic:after{content:"";position:absolute;inset:10px;border:1px solid var(--card-line,var(--gold));opacity:.55;pointer-events:none}
.frame-ornate{border:none}.frame-ornate:after{content:"";position:absolute;inset:8px;border:2px double var(--card-line,var(--gold));opacity:.75;pointer-events:none}
.frame-scallop{border:none}.frame-scallop:after{content:"";position:absolute;inset:9px;border:1px dashed var(--card-line,var(--gold));opacity:.6;border-radius:10px;pointer-events:none}
.frame-simple{border:1px solid var(--card-line,var(--gold))}
.card-body{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;flex:1;width:100%}
.photo-layer{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;border-radius:inherit}
.card-photo{position:absolute;pointer-events:none;overflow:hidden;border-radius:4px;box-shadow:0 8px 20px rgba(0,0,0,.35);transform-origin:center;max-width:100%;max-height:100%;box-sizing:border-box}
.card-photo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:2px}
.card-photo.photo-broken{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25)}
.card-photo.photo-broken:after{content:"🖼";font-size:1.4rem;opacity:.5}
.card-symbol{font-size:2.4rem;line-height:1;margin-top:4px;filter:drop-shadow(0 0 14px rgba(201,154,61,.55))}
.card-to{font-family:var(--font-display);font-size:1.05rem;color:var(--soft);margin:0}
.card-message{font-family:var(--font-display);font-size:1.18rem;color:var(--cream);margin:4px 0;line-height:1.45;flex:1;overflow:hidden;overflow-wrap:anywhere;white-space:pre-wrap}
.card-verse{font-size:.85rem;letter-spacing:.03em;color:var(--dim);margin:0}
.card-from{font-size:.92rem;color:var(--soft);margin:6px 0 0}
.font-script .card-message{font-family:var(--font-script);font-size:1.5rem;line-height:1.35}
.font-sans .card-message{font-family:var(--font-ui);font-weight:500;font-size:1rem}
.font-sans .card-to,.font-sans .card-from{font-family:var(--font-ui)}
</style></head><body><main class="wrap"><div style="margin-bottom:14px"><a href="index.html" class="btn">← Back to Home</a></div><header class="head"><h1>Personal History</h1><a href="card-builder.html">Create a card</a></header><div id="status" class="empty">Loading your saved creations…</div><section class="grid" id="grid"></section></main><script src="config.js"></script><script>
(function(){var API=window.YSL_API_URL||"";function id(k){var v=localStorage.getItem(k);if(!v){v=crypto.randomUUID?crypto.randomUUID():k+Date.now()+Math.random();localStorage.setItem(k,v)}return v}var uid=id('yslBlessingUserId'),key=id('yslBlessingUserKey'),status=document.getElementById('status'),grid=document.getElementById('grid');function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
 
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
var ACCENTS={gold:"#c99a3d",rose:"#c97b8c",ember:"#b4522f",dawn:"#8fa6c9"};
 
// Renders the ACTUAL blessing-card design (frame/background/font/accent/
// message/verse/photos) so the history preview matches the real card
// instead of a separate mini-card mockup.
function renderCardPreview(st){
  st=st||{};
  var frame=st.frame||'frame-classic', bg=st.bg||'bg-plain', font=st.font||'font-serif';
  var accent=ACCENTS[st.accent]||ACCENTS.gold;
  var line=(st.accent==='gold'||!st.accent)?'#e3c988':accent;
 
  var stage=document.createElement('div');
  stage.className='preview-stage';
 
  var card=document.createElement('article');
  card.className='blessing-card '+frame+' '+bg;
  card.style.setProperty('--card-accent',accent);
  card.style.setProperty('--card-line',line);
 
  var bgLayer=document.createElement('div');
  bgLayer.className='card-layer-bg';
  card.appendChild(bgLayer);
 
  var photoLayer=document.createElement('div');
  photoLayer.className='photo-layer';
  card.appendChild(photoLayer);
 
  var body=document.createElement('div');
  body.className='card-body '+font;
  body.innerHTML=
    '<div class="card-symbol">'+esc(st.symbol||'🕊️')+'</div>'+
    '<p class="card-to">For '+esc(st.to||'a friend')+'</p>'+
    '<p class="card-message" style="max-height:'+(clamp(Number(st.messageHeight)||110,70,210))+'px;height:'+(clamp(Number(st.messageHeight)||110,70,210))+'px">'+esc(st.msg||'')+'</p>'+
    '<p class="card-verse">'+esc(st.verse||'')+'</p>'+
    '<p class="card-from">— '+esc(st.from||'')+'</p>';
  card.appendChild(body);
 
  // real photo layout, matching card-builder's positioning/sizing
  (st.photos||[]).slice(0,3).forEach(function(photo){
    var el=document.createElement('div');
    el.className='card-photo';
    var ratio=Number(photo.ratio)||1;
    var width=clamp(Number(photo.width)||180,60,320);
    var height=clamp(Number(photo.height)||Math.round(width/ratio),60,320);
    var maxW=340*.82, maxH=460*.48;
    var scale=Math.min(1, maxW/width||1, maxH/height||1);
    width=Math.max(60,width*scale); height=Math.max(60,height*scale);
    el.style.width=width+'px'; el.style.height=height+'px';
    el.style.left=clamp(Number(photo.x)||50,5,95)+'%';
    el.style.top=clamp(Number(photo.y)||50,5,95)+'%';
    el.style.transform='translate(-50%,-50%) rotate('+(Number(photo.rotation)||0)+'deg)';
    var img=document.createElement('img');
    img.src=photo.dataUrl||photo.url||'';
    img.alt=photo.name||'Uploaded photo';
    img.onerror=function(){el.classList.add('photo-broken');img.style.display='none'};
    el.appendChild(img);
    photoLayer.appendChild(el);
  });
 
  stage.appendChild(card);
  return stage;
}
 
function fitPreview(container,stage){
  var pw=container.clientWidth||240, ph=container.clientHeight||270;
  var scale=Math.min(pw/340, ph/460);
  stage.style.transform='scale('+scale+')';
}
 
function render(items){status.style.display=items.length?'none':'block';grid.innerHTML='';items.forEach(function(x){var st=x.state||{};var c=document.createElement('article');c.className='card';var preview=document.createElement('div');preview.className='preview';var stage=renderCardPreview(st);preview.appendChild(stage);var meta=document.createElement('div');meta.className='meta';meta.innerHTML='<strong>'+esc(st.to||'Blessing card')+'</strong><br><small>Updated '+new Date(x.updatedAt||x.createdAt).toLocaleString()+' • '+((st.photos||[]).length)+' photo(s)</small>';var actions=document.createElement('div');actions.className='actions';actions.innerHTML='<button>Edit</button><button class="danger">Delete</button>';c.appendChild(preview);c.appendChild(meta);c.appendChild(actions);grid.appendChild(c);fitPreview(preview,stage);actions.querySelectorAll('button')[0].onclick=function(){location.href='card-builder.html?edit=1#id='+encodeURIComponent(x.id)};actions.querySelectorAll('button')[1].onclick=function(){if(confirm('Are you sure you want to delete this creation?\n\nThis action cannot be undone.'))post({action:'delete',userId:uid,userKey:key,creationId:x.id},function(){c.remove();if(!grid.children.length)status.style.display='block'})}});window.addEventListener('resize',function(){Array.prototype.forEach.call(grid.children,function(c){var preview=c.querySelector('.preview'),stage=c.querySelector('.preview-stage');if(preview&&stage)fitPreview(preview,stage)})})}
 
function jsonp(){var cb='hist_'+Date.now();window[cb]=function(d){if(d&&d.ok)render(d.items||[]);else{status.textContent='Could not load history.'}var s=document.getElementById(cb);if(s)s.remove();delete window[cb]};var sc=document.createElement('script');sc.id=cb;sc.src=API+'?action=getHistory&userId='+encodeURIComponent(uid)+'&userKey='+encodeURIComponent(key)+'&callback='+cb;sc.onerror=function(){status.textContent='Could not connect to history service.';sc.remove();delete window[cb]};document.body.appendChild(sc)}function post(fields,done){var f=document.createElement('form');f.method='POST';f.action=API;f.target='histFrame';f.style.display='none';Object.keys(fields).forEach(function(k){var i=document.createElement('input');i.type='hidden';i.name=k;i.value=fields[k];f.appendChild(i)});document.body.appendChild(f);f.submit();setTimeout(function(){f.remove();if(done)done()},700)}var fr=document.createElement('iframe');fr.name='histFrame';fr.hidden=true;document.body.appendChild(fr);jsonp()})();
</script></body></html>
