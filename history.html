<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Personal History — A Blessing to Share</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&family=Petit+Formal+Script&display=swap" rel="stylesheet">

<style>

:root{
  --deep:#2a0a10;
  --mid:#421119;
  --panel:#3a0f16;
  --gold:#c99a3d;
  --soft:#e3c988;
  --cream:#f4e8d9;
  --dim:#cdb2a6;
  --line:#6e2530;

  --font-display:
    'Cormorant Garamond',
    Georgia,
    serif;

  --font-script:
    'Petit Formal Script',
    cursive;

  --font-ui:
    'Work Sans',
    sans-serif;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  font-family:var(--font-ui);
  background:
    radial-gradient(
      circle at 50% 10%,
      #4a1820,
      #2a0a10 55%,
      #180508
    );
  color:var(--cream);
  overflow-x:hidden;
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:26px 22px 60px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:26px;
}

.head h1{
  font-family:var(--font-display);
  font-size:2.4rem;
  color:var(--soft);
  margin:0;
}

.btn{
  border:1px solid rgba(201,154,61,.35);
  background:rgba(42,10,16,.7);
  color:var(--cream);
  text-decoration:none;
  padding:9px 14px;
  border-radius:20px;
  cursor:pointer;
}

.btn:hover{
  background:rgba(201,154,61,.08);
}

.status{
  padding:50px 20px;
  text-align:center;
  color:var(--dim);
  border:1px dashed rgba(201,154,61,.25);
  border-radius:10px;
  background:rgba(58,15,22,.35);
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(
      auto-fill,
      minmax(240px,1fr)
    );
  gap:18px;
}

.card{
  background:rgba(58,15,22,.86);
  border:1px solid rgba(201,154,61,.2);
  border-radius:10px;
  padding:13px;
  box-shadow:
    0 16px 35px rgba(0,0,0,.25);
}

.preview{
  height:270px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#241012;
  border-radius:7px;
  overflow:hidden;
  position:relative;
}

.preview-stage{
  position:relative;
  width:340px;
  height:460px;
  flex:none;
}

.meta{
  padding:10px 2px;
}

.meta strong{
  color:var(--soft);
}

.meta small{
  color:var(--dim);
  line-height:1.5;
}

.actions{
  display:flex;
  gap:7px;
}

.actions button{
  flex:1;
  border:1px solid rgba(201,154,61,.35);
  background:rgba(0,0,0,.18);
  color:var(--cream);
  padding:8px;
  border-radius:6px;
  cursor:pointer;
}

.actions button:hover{
  background:rgba(201,154,61,.08);
}

.actions button:first-child{
  background:
    linear-gradient(
      180deg,
      var(--soft),
      var(--gold)
    );
  color:#241012;
  border:0;
}

.actions .danger{
  color:#f0b0b0;
}

.actions .danger:hover{
  background:rgba(240,176,176,.08);
}


/* =====================================================
   REAL BLESSING CARD PREVIEW
===================================================== */

.blessing-card{
  position:relative;

  width:340px;
  min-height:460px;
  height:460px;

  background:
    linear-gradient(
      165deg,
      var(--panel),
      var(--mid)
    );

  border:
    1px solid
    var(--card-line,var(--gold));

  border-radius:2px;

  padding:
    30px 26px 26px;

  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;

  box-shadow:
    0 20px 45px rgba(0,0,0,.4);

  overflow:hidden;
}


/* BACKGROUND */

.card-layer-bg{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.55;
}

.bg-plain .card-layer-bg{
  background:none;
}

.bg-rays .card-layer-bg{
  background:
    repeating-conic-gradient(
      from 0deg
      at 50% 0%,
      rgba(201,154,61,.10)
      0deg 6deg,
      transparent 6deg 16deg
    );
}

.bg-dots .card-layer-bg{
  background-image:
    radial-gradient(
      var(--card-line,var(--gold))
      1px,
      transparent 1.4px
    );

  background-size:
    16px 16px;

  opacity:.28;
}

.bg-weave .card-layer-bg{
  background-image:
    linear-gradient(
      45deg,
      rgba(201,154,61,.10)
      25%,
      transparent 25%,
      transparent 75%,
      rgba(201,154,61,.10) 75%
    ),
    linear-gradient(
      -45deg,
      rgba(201,154,61,.10)
      25%,
      transparent 25%,
      transparent 75%,
      rgba(201,154,61,.10) 75%
    );

  background-size:
    18px 18px;
}


/* FRAMES */

.frame-classic:after{
  content:"";
  position:absolute;
  inset:10px;
  border:
    1px solid
    var(--card-line,var(--gold));
  opacity:.55;
  pointer-events:none;
}

.frame-ornate{
  border:none;
}

.frame-ornate:after{
  content:"";
  position:absolute;
  inset:8px;
  border:
    2px double
    var(--card-line,var(--gold));
  opacity:.75;
  pointer-events:none;
}

.frame-scallop{
  border:none;
}

.frame-scallop:after{
  content:"";
  position:absolute;
  inset:9px;
  border:
    1px dashed
    var(--card-line,var(--gold));
  opacity:.6;
  border-radius:10px;
  pointer-events:none;
}

.frame-simple{
  border:
    1px solid
    var(--card-line,var(--gold));
}


/* BODY */

.card-body{
  position:relative;
  z-index:2;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:14px;

  flex:1;
  width:100%;
}


/* PHOTOS */

.photo-layer{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
  overflow:hidden;
  border-radius:inherit;
}

.card-photo{
  position:absolute;
  pointer-events:none;
  overflow:hidden;
  border-radius:4px;

  box-shadow:
    0 8px 20px rgba(0,0,0,.35);

  transform-origin:center;

  max-width:100%;
  max-height:100%;

  box-sizing:border-box;
}

.card-photo img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:2px;
}

.card-photo.photo-broken{
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.25);
}

.card-photo.photo-broken:after{
  content:"🖼";
  font-size:1.4rem;
  opacity:.5;
}


/* TEXT */

.card-symbol{
  font-size:2.4rem;
  line-height:1;
  margin-top:4px;

  filter:
    drop-shadow(
      0 0 14px
      rgba(201,154,61,.55)
    );
}

.card-to{
  font-family:var(--font-display);
  font-size:1.05rem;
  color:var(--soft);
  margin:0;
}

.card-message{
  font-family:var(--font-display);
  font-size:1.18rem;
  color:var(--cream);

  margin:4px 0;

  line-height:1.45;

  flex:1;

  overflow:hidden;
  overflow-wrap:anywhere;

  white-space:pre-wrap;
}

.card-verse{
  font-size:.85rem;
  letter-spacing:.03em;
  color:var(--dim);
  margin:0;
}

.card-from{
  font-size:.92rem;
  color:var(--soft);
  margin:6px 0 0;
}


/* FONT OPTIONS */

.font-script .card-message{
  font-family:var(--font-script);
  font-size:1.5rem;
  line-height:1.35;
}

.font-sans .card-message{
  font-family:var(--font-ui);
  font-weight:500;
  font-size:1rem;
}

.font-sans .card-to,
.font-sans .card-from{
  font-family:var(--font-ui);
}


/* MOBILE */

@media(max-width:600px){

  .wrap{
    padding:
      20px
      14px
      45px;
  }

  .head{
    align-items:flex-start;
    flex-direction:column;
  }

  .head h1{
    font-size:2rem;
  }

  .head .btn{
    width:100%;
    text-align:center;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .preview{
    height:310px;
  }

}

</style>

</head>

<body>

<main class="wrap">

  <!-- BACK -->

  <div style="margin-bottom:14px;">


<a
  href="index.html"
  class="btn"
>
  ← Back to Home
</a>


  </div>

  <!-- HEADER -->

  <header class="head">


<h1>
  Personal History
</h1>

<a
  href="card-builder.html"
  class="btn"
>
  Create a card
</a>


  </header>

  <!-- STATUS -->

  <div
    id="status"
    class="status"
  >
    Loading your saved creations…
  </div>

  <!-- CARDS -->

  <section
    class="grid"
    id="grid"
  ></section>

</main>

<script src="config.js"></script>

<script>
(function(){

  "use strict";


  /* =================================================
     API
  ================================================= */

  var API =
    window.YSL_CONFIG &&
    window.YSL_CONFIG.API_URL
      ? window.YSL_CONFIG.API_URL
      : "";


  /* =================================================
     ELEMENTS
  ================================================= */

  var status =
    document.getElementById(
      "status"
    );

  var grid =
    document.getElementById(
      "grid"
    );


  /* =================================================
     CREATOR IDENTITY
  ================================================= */

  function getOrCreateId(key){

    var value =
      localStorage.getItem(
        key
      );


    if (value){
      return value;
    }


    var generated;


    try{

      if (
        window.crypto &&
        crypto.randomUUID
      ){

        generated =
          crypto.randomUUID();

      }else{

        generated =
          key +
          "_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2);

      }

    }catch(error){

      generated =
        key +
        "_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2);

    }


    localStorage.setItem(
      key,
      generated
    );


    return generated;

  }


  var uid =
    getOrCreateId(
      "yslBlessingUserId"
    );


  var key =
    getOrCreateId(
      "yslBlessingUserKey"
    );


  /* =================================================
     API CHECK
  ================================================= */

  if (!API){

    status.textContent =
      "Could not connect to the blessing service. Check config.js.";

    return;

  }


  /* =================================================
     ESCAPE
  ================================================= */

  function esc(value){

    return String(
      value == null
        ? ""
        : value
    )
    .replace(
      /[&<>"']/g,
      function(char){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[char];

      }
    );

  }


  /* =================================================
     CLAMP
  ================================================= */

  function clamp(
    number,
    minimum,
    maximum
  ){

    return Math.max(
      minimum,
      Math.min(
        maximum,
        number
      )
    );

  }


  /* =================================================
     ACCENTS
  ================================================= */

  var ACCENTS = {

    gold:"#c99a3d",

    rose:"#c97b8c",

    ember:"#b4522f",

    dawn:"#8fa6c9"

  };


  /* =================================================
     RENDER REAL CARD
  ================================================= */

  function renderCardPreview(
    state
  ){

    state =
      state || {};


    var frame =
      state.frame ||
      "frame-classic";


    var bg =
      state.bg ||
      "bg-plain";


    var font =
      state.font ||
      "font-serif";


    var accent =
      ACCENTS[
        state.accent
      ] ||
      ACCENTS.gold;


    var line =
      (
        state.accent === "gold" ||
        !state.accent
      )
        ? "#e3c988"
        : accent;


    var stage =
      document.createElement(
        "div"
      );


    stage.className =
      "preview-stage";


    var card =
      document.createElement(
        "article"
      );


    card.className =
      "blessing-card " +
      frame +
      " " +
      bg;


    card.style.setProperty(
      "--card-accent",
      accent
    );


    card.style.setProperty(
      "--card-line",
      line
    );


    /* BACKGROUND */
    var bgLayer =
      document.createElement(
        "div"
      );


    bgLayer.className =
      "card-layer-bg";


    card.appendChild(
      bgLayer
    );


    /* PHOTO LAYER */
    var photoLayer =
      document.createElement(
        "div"
      );


    photoLayer.className =
      "photo-layer";


    card.appendChild(
      photoLayer
    );


    /* CARD BODY */
    var body =
      document.createElement(
        "div"
      );


    body.className =
      "card-body " +
      font;


    var messageHeight =
      clamp(
        Number(
          state.messageHeight
        ) || 110,
        70,
        210
      );


    body.innerHTML =
      '<div class="card-symbol">' +
      esc(
        state.symbol ||
        "🕊️"
      ) +
      "</div>" +

      '<p class="card-to">' +
      "For " +
      esc(
        state.to ||
        "a friend"
      ) +
      "</p>" +

      '<p class="card-message" ' +
      'style="max-height:' +
      messageHeight +
      "px;height:" +
      messageHeight +
      'px">' +
      esc(
        state.msg ||
        ""
      ) +
      "</p>" +

      '<p class="card-verse">' +
      esc(
        state.verse ||
        ""
      ) +
      "</p>" +

      '<p class="card-from">' +
      "— " +
      esc(
        state.from ||
        ""
      ) +
      "</p>";


    card.appendChild(
      body
    );


    /* PHOTOS */
    var photoList =
      Array.isArray(
        state.photos
      )
        ? state.photos
        : [];


    photoList
      .slice(0,3)
      .forEach(
        function(photo){

          if (!photo){
            return;
          }


          var el =
            document.createElement(
              "div"
            );


          el.className =
            "card-photo";


          var ratio =
            Number(
              photo.ratio
            ) || 1;


          var width =
            clamp(
              Number(
                photo.width
              ) || 180,
              60,
              320
            );


          var height =
            clamp(
              Number(
                photo.height
              ) ||
              Math.round(
                width /
                ratio
              ),
              60,
              320
            );


          var maxW =
            340 * .82;


          var maxH =
            460 * .48;


          var scale =
            Math.min(
              1,
              maxW /
                width ||
                1,
              maxH /
                height ||
                1
            );


          width =
            Math.max(
              60,
              width * scale
            );


          height =
            Math.max(
              60,
              height * scale
            );


          el.style.width =
            width +
            "px";


          el.style.height =
            height +
            "px";


          el.style.left =
            clamp(
              Number(
                photo.x
              ) || 50,
              5,
              95
            ) +
            "%";


          el.style.top =
            clamp(
              Number(
                photo.y
              ) || 50,
              5,
              95
            ) +
            "%";


          el.style.transform =
            "translate(-50%,-50%) " +
            "rotate(" +
            (
              Number(
                photo.rotation
              ) || 0
            ) +
            "deg)";


          var img =
            document.createElement(
              "img"
            );


          img.src =
            photo.dataUrl ||
            photo.url ||
            "";


          img.alt =
            photo.name ||
            "Uploaded photo";


          img.onerror =
            function(){

              el.classList.add(
                "photo-broken"
              );

              img.style.display =
                "none";

            };


          el.appendChild(
            img
          );


          photoLayer.appendChild(
            el
          );

        }
      );


    stage.appendChild(
      card
    );


    return stage;

  }


  /* =================================================
     FIT PREVIEW
  ================================================= */

  function fitPreview(
    container,
    stage
  ){

    var pw =
      container.clientWidth ||
      240;


    var ph =
      container.clientHeight ||
      270;


    var scale =
      Math.min(
        pw / 340,
        ph / 460
      );


    stage.style.transform =
      "scale(" +
      scale +
      ")";

  }


  /* =================================================
     RENDER HISTORY
  ================================================= */

  function render(
    items
  ){

    items =
      Array.isArray(items)
        ? items
        : [];


    grid.innerHTML =
      "";


    if (!items.length){

      status.style.display =
        "block";


      status.textContent =
        "You don't have any saved creations yet.";


      return;

    }


    status.style.display =
      "none";


    items.forEach(
      function(item){

        var state =
          item.state ||
          {};


        var card =
          document.createElement(
            "article"
          );


        card.className =
          "card";


        /* PREVIEW */
        var preview =
          document.createElement(
            "div"
          );


        preview.className =
          "preview";


        var stage =
          renderCardPreview(
            state
          );


        preview.appendChild(
          stage
        );


        /* META */
        var meta =
          document.createElement(
            "div"
          );


        meta.className =
          "meta";


        var recipient =
          state.to ||
          state.recipient ||
          "Blessing card";


        var photoCount =
          Array.isArray(
            state.photos
          )
            ? state.photos.length
            : 0;


        meta.innerHTML =
          "<strong>" +
          esc(
            recipient
          ) +
          "</strong>" +

          "<br>" +

          "<small>" +

          "Updated " +

          esc(
            formatDate(
              item.updatedAt ||
              item.createdAt
            )
          ) +

          " • " +

          photoCount +

          " photo(s)" +

          "</small>";


        /* ACTIONS */
        var actions =
          document.createElement(
            "div"
          );


        actions.className =
          "actions";


        var editBtn =
          document.createElement(
            "button"
          );


        editBtn.type =
          "button";


        editBtn.textContent =
          "Edit";


        editBtn.onclick =
          function(){

            location.href =
              "card-builder.html?edit=1#id=" +
              encodeURIComponent(
                item.id
              );

          };


        var deleteBtn =
          document.createElement(
            "button"
          );


        deleteBtn.type =
          "button";


        deleteBtn.className =
          "danger";


        deleteBtn.textContent =
          "Delete";


        deleteBtn.onclick =
          function(){

            deleteCreation(
              item.id,
              card
            );

          };


        actions.appendChild(
          editBtn
        );


        actions.appendChild(
          deleteBtn
        );


        card.appendChild(
          preview
        );


        card.appendChild(
          meta
        );


        card.appendChild(
          actions
        );


        grid.appendChild(
          card
        );


        fitPreview(
          preview,
          stage
        );

      }
    );

  }


  /* =================================================
     DELETE PERSONAL CREATION
  ================================================= */

  function deleteCreation(
    creationId,
    cardElement
  ){

    if (!creationId){

      alert(
        "Creation ID is missing."
      );

      return;

    }


    if (
      !confirm(
        "Are you sure you want to delete this creation?\n\n" +
        "This action cannot be undone."
      )
    ){

      return;

    }


    status.style.display =
      "block";


    status.textContent =
      "Deleting creation…";


    var form =
      document.createElement(
        "form"
      );


    form.method =
      "POST";


    form.action =
      API;


    form.target =
      "historyFrame";


    form.style.display =
      "none";


    addInput(
      form,
      "action",
      "delete"
    );


    addInput(
      form,
      "userId",
      uid
    );


    addInput(
      form,
      "userKey",
      key
    );


    addInput(
      form,
      "creationId",
      creationId
    );


    document.body.appendChild(
      form
    );


    form.submit();


    /*
     * Wait briefly for Apps Script
     * before removing from the UI.
     */
    setTimeout(
      function(){

        if (form.parentNode){

          form.parentNode.removeChild(
            form
          );

        }


        if (
          cardElement &&
          cardElement.parentNode
        ){

          cardElement.parentNode.removeChild(
            cardElement
          );

        }


        if (
          !grid.children.length
        ){

          status.style.display =
            "block";

          status.textContent =
            "You don't have any saved creations yet.";

        }else{

          status.style.display =
            "none";

        }

      },
      900
    );

  }


  /* =================================================
     LOAD PERSONAL HISTORY
  ================================================= */

  function loadHistory(){

    status.style.display =
      "block";


    status.textContent =
      "Loading your saved creations…";


    var callbackName =
      "history_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2);


    var script =
      document.createElement(
        "script"
      );


    var finished =
      false;


    function finish(
      data
    ){

      if (finished){
        return;
      }


      finished =
        true;


      try{

        delete window[
          callbackName
        ];

      }catch(error){}


      if (
        script.parentNode
      ){

        script.parentNode.removeChild(
          script
        );

      }


      if (
        data &&
        data.ok
      ){

        render(
          data.items ||
          []
        );

      }else{

        status.style.display =
          "block";

        status.textContent =
          (
            data &&
            (
              data.error ||
              data.message
            )
          ) ||
          "Could not load history.";

      }

    }


    window[
      callbackName
    ] =
      function(data){

        finish(
          data
        );

      };


    var url =
      API +
      "?action=getHistory" +
      "&userId=" +
      encodeURIComponent(uid) +
      "&userKey=" +
      encodeURIComponent(key) +
      "&callback=" +
      encodeURIComponent(
        callbackName
      );


    script.src =
      url;


    script.onerror =
      function(){

        finish({
          ok:false,
          error:
            "Could not connect to history service."
        });

      };


    document.body.appendChild(
      script
    );

  }


  /* =================================================
     HELPERS
  ================================================= */

  function addInput(
    form,
    name,
    value
  ){

    var input =
      document.createElement(
        "input"
      );


    input.type =
      "hidden";


    input.name =
      name;


    input.value =
      value == null
        ? ""
        : value;


    form.appendChild(
      input
    );

  }


  function formatDate(
    value
  ){

    if (!value){
      return "—";
    }


    var date =
      new Date(value);


    if (
      isNaN(
        date.getTime()
      )
    ){

      return String(
        value
      );

    }


    return date.toLocaleString();

  }


  /* =================================================
     RESIZE
  ================================================= */

  window.addEventListener(
    "resize",
    function(){

      Array.prototype.forEach.call(
        grid.children,
        function(card){

          var preview =
            card.querySelector(
              ".preview"
            );


          var stage =
            card.querySelector(
              ".preview-stage"
            );


          if (
            preview &&
            stage
          ){

            fitPreview(
              preview,
              stage
            );

          }

        }
      );

    }
  );


  /* =================================================
     HIDDEN POST FRAME
  ================================================= */

  var frame =
    document.createElement(
      "iframe"
    );


  frame.name =
    "historyFrame";


  frame.id =
    "historyFrame";


  frame.hidden =
    true;


  document.body.appendChild(
    frame
  );


  /* =================================================
     START
  ================================================= */

  loadHistory();


})();
</script>

</body>
</html>
