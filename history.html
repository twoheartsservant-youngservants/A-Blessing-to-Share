<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Personal History — A Blessing to Share</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&family=Petit+Formal+Script&display=swap" rel="stylesheet">

<style>

:root{
  --deep:#2a0a10;
  --mid:#421119;
  --panel:#3a0f16;
  --gold:#c99a3d;
  --soft:#e3c988;
  --cream:#f4e8d9;
  --dim:#cdb2a6;
  --line:#6e2530;
  --ui:'Work Sans',sans-serif;
  --display:'Cormorant Garamond',Georgia,serif;
  --script:'Petit Formal Script',cursive
}

*{
  box-sizing:border-box
}

html,
body{
  margin:0;
  min-height:100%;
  font-family:var(--ui);
  background:
    radial-gradient(
      circle at 50% 10%,
      #4a1820,
      #2a0a10 55%,
      #180508
    );
  color:var(--cream)
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:26px 22px 60px
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:26px
}

.head h1{
  font-family:var(--display);
  font-size:2.4rem;
  color:var(--soft);
  margin:0
}

.btn{
  border:1px solid rgba(201,154,61,.35);
  background:rgba(42,10,16,.7);
  color:var(--cream);
  text-decoration:none;
  padding:9px 14px;
  border-radius:20px;
  cursor:pointer
}

.btn:hover{
  background:rgba(201,154,61,.08)
}

.status{
  padding:50px 20px;
  text-align:center;
  color:var(--dim);
  border:1px dashed rgba(201,154,61,.25);
  border-radius:10px;
  background:rgba(58,15,22,.35)
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(
      auto-fill,
      minmax(240px,1fr)
    );
  gap:18px
}

.card{
  background:rgba(58,15,22,.86);
  border:1px solid rgba(201,154,61,.2);
  border-radius:10px;
  padding:13px;
  box-shadow:
    0 16px 35px rgba(0,0,0,.25)
}

.preview{
  height:270px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#241012;
  border-radius:7px;
  overflow:hidden;
  position:relative
}

.stage{
  width:340px;
  height:460px;
  flex:none;
  position:relative;
  transform-origin:center center
}

.blessing{
  position:relative;
  width:340px;
  height:460px;
  padding:30px 26px 26px;

  background:var(--bg,#fffdfb);
  color:var(--font,#4c0a16);

  border:2px solid var(--line,#c89b3c);
  border-radius:4px;

  overflow:hidden;

  display:flex;
  flex-direction:column;

  text-align:center;

  font-family:
    var(
      --family,
      Georgia,
      serif
    );

  box-shadow:
    0 20px 45px rgba(0,0,0,.4)
}

.blessing:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.45;
  pointer-events:none;
  background-image:
    var(--texture,none)
}

.blessing:after{
  content:"";
  position:absolute;
  inset:10px;

  border:
    var(--iw,1px)
    var(--is,solid)
    var(--iline,#c89b3c);

  pointer-events:none;
  opacity:.65
}

.body{
  position:relative;
  z-index:2;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:10px;

  flex:1;
  width:100%
}

.symbol{
  font-size:2.2rem;
  line-height:1
}

.to{
  font-family:var(--display);
  font-size:1rem;
  color:var(--line);
  margin:0
}

.message{
  font-family:inherit;
  font-size:1.12rem;
  line-height:1.42;

  white-space:pre-wrap;
  overflow:hidden;

  flex:1;
  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:2px 0
}

.verse{
  font-size:.8rem;
  opacity:.7;
  margin:0
}

.from{
  font-size:.9rem;
  color:var(--line);
  margin:2px 0 0
}

.photos{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
  overflow:hidden
}

.photo{
  position:absolute;
  overflow:hidden;
  transform-origin:center;
  box-shadow:
    0 8px 20px rgba(0,0,0,.3)
}

.photo img{
  display:block;
  position:absolute;
  max-width:none;
  max-height:none;
}

.meta{
  padding:10px 2px
}

.meta strong{
  color:var(--soft)
}

.meta small{
  color:var(--dim);
  line-height:1.5
}

.actions{
  display:flex;
  gap:7px
}

.actions button{
  flex:1;

  border:
    1px solid
    rgba(201,154,61,.35);

  background:rgba(0,0,0,.18);
  color:var(--cream);

  padding:8px;
  border-radius:6px;

  cursor:pointer
}

.actions button:first-child{
  background:
    linear-gradient(
      180deg,
      var(--soft),
      var(--gold)
    );

  color:#241012;
  border:0
}

.danger{
  color:#f0b0b0!important
}

.empty{
  display:none
}

@media(max-width:600px){

  .wrap{
    padding:20px 14px 45px
  }

  .head{
    align-items:flex-start;
    flex-direction:column
  }

  .head h1{
    font-size:2rem
  }

  .head .btn{
    width:100%;
    text-align:center
  }

  .grid{
    grid-template-columns:1fr
  }

  .preview{
    height:310px
  }

}

</style>
</head>

<body>

<main class="wrap">

  <div style="margin-bottom:14px">

    <a
      href="index.html"
      class="btn"
    >
      ← Back to Home
    </a>

  </div>

  <header class="head">

    <h1>
      Personal History
    </h1>

    <a
      href="card-builder.html"
      class="btn"
    >
      Create a card
    </a>

  </header>

  <div
    id="status"
    class="status"
  >
    Loading your saved creations…
  </div>

  <section
    id="grid"
    class="grid"
  ></section>

</main>

<iframe
  name="historyFrame"
  id="historyFrame"
  hidden
></iframe>

<script src="config.js"></script>

<script>

(function(){

"use strict";


/* =====================================================
   API
===================================================== */

const API =
  window.YSL_CONFIG &&
  window.YSL_CONFIG.API_URL
    ? window.YSL_CONFIG.API_URL
    : "";


const status =
  document.getElementById("status");

const grid =
  document.getElementById("grid");


/* =====================================================
   CREATOR ID
   MUST MATCH CARD-BUILDER.HTML
===================================================== */

function createCreatorId(){

  return (
    "creator_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,12)
  );

}


function getCreatorId(){

  /*
   * THIS IS THE PRIMARY KEY USED BY
   * YOUR CURRENT CARD BUILDER.
   */
  const storageKey =
    "ysl_blessing_creator_id";

  let creatorId = "";

  try{

    creatorId =
      localStorage.getItem(
        storageKey
      ) || "";

  }

  catch(error){

    console.warn(
      "Could not read creator ID.",
      error
    );

  }


  /*
   * Older version compatibility.
   */
  if(!creatorId){

    try{

      creatorId =
        localStorage.getItem(
          "ysl_creator_id"
        ) || "";

    }

    catch(error){

      console.warn(
        "Could not read legacy creator ID.",
        error
      );

    }

  }


  /*
   * Older user ID compatibility.
   */
  if(!creatorId){

    try{

      creatorId =
        localStorage.getItem(
          "ysl_user_id"
        ) || "";

    }

    catch(error){

      console.warn(
        "Could not read legacy user ID.",
        error
      );

    }

  }


  /*
   * If no identity exists, create one.
   *
   * This uses the SAME format as your
   * current card-builder.html.
   */
  if(!creatorId){

    creatorId =
      createCreatorId();

    try{

      localStorage.setItem(
        storageKey,
        creatorId
      );

    }

    catch(error){

      console.warn(
        "Could not save creator ID.",
        error
      );

    }

  }


  /*
   * Always synchronize the current key.
   */
  try{

    localStorage.setItem(
      storageKey,
      creatorId
    );

  }

  catch(error){

    console.warn(
      "Could not synchronize creator ID.",
      error
    );

  }


  return creatorId;

}


const creatorId =
  getCreatorId();


/* =====================================================
   LEGACY VALUES
===================================================== */

const legacyId =
  localStorage.getItem(
    "ysl_user_id"
  ) || "";


const creatorKey =
  localStorage.getItem(
    "yslBlessingUserKey"
  ) ||
  localStorage.getItem(
    "ysl_user_key"
  ) ||
  "";


/* =====================================================
   HELPERS
===================================================== */

function esc(v){

  return String(
    v == null ? "" : v
  ).replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );

}


function clamp(v,a,b){

  return Math.max(
    a,
    Math.min(b,v)
  );

}


function hex(v){

  return /^#[0-9a-f]{6}$/i.test(
    String(v || "")
  )
    ? v
    : "#c89b3c";

}


function texture(type,color){

  const c =
    hex(color);

  const rgba =
    (a)=>{

      const n =
        c.slice(1);

      const r =
        parseInt(
          n.slice(0,2),
          16
        );

      const g =
        parseInt(
          n.slice(2,4),
          16
        );

      const b =
        parseInt(
          n.slice(4,6),
          16
        );

      return `rgba(${r},${g},${b},${a})`;

    };


  const x =
    String(type || "")
      .toLowerCase();


  if(
    x.includes("dot")
  ){

    return `
      radial-gradient(
        circle,
        ${rgba(.3)} 1px,
        transparent 1.5px
      )
    `;

  }


  if(
    x.includes("ray") ||
    x.includes("sunburst") ||
    x.includes("beam")
  ){

    return `
      repeating-conic-gradient(
        from 0deg at 50% 50%,
        ${rgba(.14)} 0deg 4deg,
        transparent 4deg 18deg
      )
    `;

  }


  if(
    x.includes("weave")
  ){

    return `
      linear-gradient(
        45deg,
        ${rgba(.08)} 25%,
        transparent 25%,
        transparent 75%,
        ${rgba(.08)} 75%
      ),
      linear-gradient(
        -45deg,
        ${rgba(.08)} 25%,
        transparent 25%,
        transparent 75%,
        ${rgba(.08)} 75%
      )
    `;

  }


  return "none";

}


/* =====================================================
   NORMALIZE
===================================================== */



function normalizeTextureName(value){

  const raw =
    String(value ?? "").trim();


  const key =
    raw
      .toLowerCase()
      .replace(/[_-]+/g," ")
      .replace(/\s+/g," ")
      .trim();


  const map = {

    "fine paper":
      "fine-paper",

    "diagonal lines":
      "diagonal-lines",

    "crosshatch":
      "crosshatch",

    "tiny dots":
      "tiny-dots",

    "grid":
      "grid",

    "diamond":
      "diamond",

    "linen":
      "linen",

    "soft waves":
      "soft-waves",

    "damask":
      "damask",

    "noise like grain":
      "noise-grain",

    "vertical pinstripes":
      "vertical-pinstripes",

    "horizontal pinstripes":
      "horizontal-pinstripes",

    "hexagon":
      "hexagon",

    "checker":
      "checker",

    "scallop":
      "scallop",

    "vintage paper":
      "vintage-paper",

    "soft circles":
      "soft-circles",

    "sunburst":
      "sunburst",

    "starburst":
      "starburst",

    "micro diamond":
      "micro-diamond",

    "herringbone":
      "herringbone",

    "basketweave":
      "basketweave",

    "zigzag":
      "zigzag",

    "chevron":
      "chevron",

    "honeycomb":
      "honeycomb",

    "polka dots":
      "polka-dots",

    "speckles":
      "speckles",

    "ripples":
      "ripples",

    "concentric circles":
      "concentric-circles",

    "radial lines":
      "radial-lines",

    "spiral":
      "spiral",

    "lace":
      "lace",

    "woodgrain":
      "woodgrain",

    "marble like":
      "marble-like",

    "frosted":
      "frosted",

    "embossed":
      "embossed",

    "woven fabric":
      "woven-fabric",

    "canvas":
      "canvas",

    "parchment":
      "parchment",

    "watercolor like grain":
      "watercolor-grain"

  };


  return (
    map[key] ||
    raw ||
    "fine-paper"
  );
}

function getFontFamily(font){

  const raw =
    String(font ?? "").trim();

  const key =
    raw
      .toLowerCase()
      .replace(/^['"]|['"]$/g,"")
      .replace(/\s+/g," ")
      .trim();


  const fonts = {

    serif:
      "Georgia, 'Times New Roman', serif",

    classic:
      "'Times New Roman', Georgia, serif",

    modern:
      "Arial, Helvetica, sans-serif",

    elegant:
      "Garamond, Georgia, serif",

    georgia:
      "Georgia, serif",

    palatino:
      "'Palatino Linotype', Palatino, Georgia, serif",

    garamond:
      "Garamond, Georgia, serif",

    cursive:
      "'Brush Script MT', 'Segoe Script', cursive",

    sans:
      "Arial, Helvetica, sans-serif",

    arial:
      "Arial, Helvetica, sans-serif",

    verdana:
      "Verdana, sans-serif",

    "trebuchet ms":
      "'Trebuchet MS', sans-serif",

    "times new roman":
      "'Times New Roman', Georgia, serif",

    "palatino linotype":
      "'Palatino Linotype', Palatino, Georgia, serif"

  };


  if(fonts[key]){
    return fonts[key];
  }


  if(
    raw.includes(",") ||
    raw.includes("serif") ||
    raw.includes("sans-serif") ||
    raw.includes("monospace") ||
    raw.includes("cursive")
  ){

    return raw;
  }


  if(raw){

    return `'${raw.replace(/'/g,"\\'")}', Arial, Helvetica, sans-serif`;

  }


  return "Georgia, serif";
}

function getTexture(
  type,
  color
){

  const texture =
    normalizeTextureName(type);

  const textureColor =
    color || "#C89B3C";

  const c =
    hexToRgba(
      textureColor,
      .22
    );

  const c2 =
    hexToRgba(
      textureColor,
      .10
    );

  const c3 =
    hexToRgba(
      textureColor,
      .055
    );


  const textures = {


    /* 1. Fine Paper */

    "fine-paper":
      `
      radial-gradient(
        circle at 20% 30%,
        ${c3} 0 1px,
        transparent 1px
      ),
      radial-gradient(
        circle at 70% 70%,
        ${c3} 0 1px,
        transparent 1px
      )
      `,


    /* 2. Diagonal Lines */

    "diagonal-lines":
      `
      repeating-linear-gradient(
        135deg,
        transparent 0 10px,
        ${c2} 10px 11px
      )
      `,


    /* 3. Crosshatch */

    "crosshatch":
      `
      repeating-linear-gradient(
        45deg,
        transparent 0 10px,
        ${c2} 10px 11px
      ),
      repeating-linear-gradient(
        -45deg,
        transparent 0 10px,
        ${c2} 10px 11px
      )
      `,


    /* 4. Tiny Dots */

    "tiny-dots":
      `
      radial-gradient(
        circle,
        ${c} 1px,
        transparent 1.5px
      )
      `,


    /* 5. Grid */

    "grid":
      `
      linear-gradient(
        ${c2} 1px,
        transparent 1px
      ),
      linear-gradient(
        90deg,
        ${c2} 1px,
        transparent 1px
      )
      `,


    /* 6. Diamond */

    "diamond":
      `
      repeating-linear-gradient(
        45deg,
        transparent 0 12px,
        ${c2} 12px 13px
      ),
      repeating-linear-gradient(
        -45deg,
        transparent 0 12px,
        ${c2} 12px 13px
      )
      `,


    /* 7. Linen */

    "linen":
      `
      repeating-linear-gradient(
        0deg,
        transparent 0 4px,
        ${c3} 4px 5px
      ),
      repeating-linear-gradient(
        90deg,
        transparent 0 4px,
        ${c3} 4px 5px
      )
      `,


    /* 8. Soft Waves */

    "soft-waves":
      `
      repeating-radial-gradient(
        ellipse at 50% 100%,
        transparent 0 13px,
        ${c2} 14px 15px,
        transparent 16px 27px
      )
      `,


    /* 9. Damask */

    "damask":
      `
      radial-gradient(
        ellipse at center,
        transparent 0 12px,
        ${c2} 13px 14px,
        transparent 15px
      ),
      radial-gradient(
        ellipse at 0 50%,
        ${c2} 0 7px,
        transparent 8px
      ),
      radial-gradient(
        ellipse at 100% 50%,
        ${c2} 0 7px,
        transparent 8px
      )
      `,


    /* 10. Noise-like Grain */

    "noise-grain":
      `
      radial-gradient(
        circle at 10% 20%,
        ${c3} 0 1px,
        transparent 1px
      ),
      radial-gradient(
        circle at 40% 70%,
        ${c3} 0 1px,
        transparent 1px
      ),
      radial-gradient(
        circle at 80% 40%,
        ${c3} 0 1px,
        transparent 1px
      ),
      radial-gradient(
        circle at 65% 90%,
        ${c3} 0 1px,
        transparent 1px
      )
      `,


    /* 11. Vertical Pinstripes */

    "vertical-pinstripes":
      `
      repeating-linear-gradient(
        90deg,
        transparent 0 7px,
        ${c2} 7px 8px
      )
      `,


    /* 12. Horizontal Pinstripes */

    "horizontal-pinstripes":
      `
      repeating-linear-gradient(
        0deg,
        transparent 0 7px,
        ${c2} 7px 8px
      )
      `,


    /* 13. Hexagon */

    "hexagon":
      `
      linear-gradient(
        30deg,
        ${c2} 12%,
        transparent 12.5%,
        transparent 87%,
        ${c2} 87.5%,
        ${c2}
      ),
      linear-gradient(
        150deg,
        ${c2} 12%,
        transparent 12.5%,
        transparent 87%,
        ${c2} 87.5%,
        ${c2}
      ),
      linear-gradient(
        30deg,
        ${c2} 12%,
        transparent 12.5%,
        transparent 87%,
        ${c2} 87.5%,
        ${c2}
      ),
      linear-gradient(
        150deg,
        ${c2} 12%,
        transparent 12.5%,
        transparent 87%,
        ${c2} 87.5%,
        ${c2}
      )
      `,


    /* 14. Checker */

    "checker":
      `
      conic-gradient(
        ${c2} 25%,
        transparent 0 50%,
        ${c2} 0 75%,
        transparent 0
      )
      `,


    /* 15. Scallop */

    "scallop":
      `
      radial-gradient(
        circle at 50% 0,
        ${c2} 0 8px,
        transparent 9px
      )
      `,


    /* 16. Vintage Paper */

    "vintage-paper":
      `
      radial-gradient(
        ellipse at center,
        ${c3},
        transparent 70%
      ),
      repeating-linear-gradient(
        0deg,
        transparent 0 5px,
        ${c3} 5px 6px
      )
      `,


    /* 17. Soft Circles */

    "soft-circles":
      `
      radial-gradient(
        circle at 20% 30%,
        ${c2} 0 30px,
        transparent 31px
      ),
      radial-gradient(
        circle at 80% 70%,
        ${c2} 0 35px,
        transparent 36px
      )
      `,


    /* 18. Sunburst */

    "sunburst":
      `
      repeating-conic-gradient(
        from 0deg at 50% 50%,
        ${c2} 0deg 4deg,
        transparent 4deg 18deg
      )
      `,


    /* 19. Starburst */

    "starburst":
      `
      repeating-conic-gradient(
        from 0deg at 50% 50%,
        ${c2} 0deg 2deg,
        transparent 2deg 36deg
      )
      `,


    /* 20. Micro-Diamond */

    "micro-diamond":
      `
      repeating-linear-gradient(
        45deg,
        transparent 0 7px,
        ${c2} 7px 8px
      ),
      repeating-linear-gradient(
        -45deg,
        transparent 0 7px,
        ${c2} 7px 8px
      )
      `,


    /* 21. Herringbone */

    "herringbone":
      `
      repeating-linear-gradient(
        45deg,
        transparent 0 8px,
        ${c2} 8px 9px,
        transparent 9px 16px
      ),
      repeating-linear-gradient(
        -45deg,
        transparent 0 8px,
        ${c2} 8px 9px,
        transparent 9px 16px
      )
      `,


    /* 22. Basketweave */

    "basketweave":
      `
      repeating-linear-gradient(
        0deg,
        transparent 0 9px,
        ${c2} 9px 10px
      ),
      repeating-linear-gradient(
        90deg,
        transparent 0 9px,
        ${c2} 9px 10px
      )
      `,


    /* 23. Zigzag */

    "zigzag":
      `
      repeating-linear-gradient(
        135deg,
        transparent 0 7px,
        ${c2} 7px 9px,
        transparent 9px 16px
      ),
      repeating-linear-gradient(
        45deg,
        transparent 0 7px,
        ${c2} 7px 9px,
        transparent 9px 16px
      )
      `,

    /* 30. Radial Lines */

    "radial-lines":

    /* 31. Spiral-like CSS effect */

    /* 32. Lace */

    "lace":

      ),

        circle at 0 0,

    /* 33. Woodgrain-like CSS */

    /* 34. Marble-like CSS */

    "marble-like":

      repeating-linear-gradient(

      ),

      )

    "embossed":

    /* 37. Woven Fabric */

    "woven-fabric":

      repeating-linear-gradient(
        0deg,

      ),

      )

    /* 38. Canvas */

    "canvas":

      ),

      )
      `,


    /* 39. Parchment */

    "parchment":
      `
      radial-gradient(
        ellipse at center,
        ${c3},
        transparent 70%
      ),
      radial-gradient(
        ellipse at 10% 90%,
        ${c2},

      ),
      radial-gradient(
        ellipse at 90% 10%,
        ${c2},
        transparent 35%
      )
      `,


    /* 40. Watercolor-like Grain */

    "watercolor-grain":
      `
      radial-gradient(
        ellipse at 20% 30%,
        ${c3} 0 35px,
        transparent 60px
      ),
      radial-gradient(
        ellipse at 75% 65%,
        ${c3} 0 45px,
        transparent 70px
      ),
      radial-gradient(
        ellipse at 50% 90%,
        ${c2} 0 30px,
        transparent 55px

  };


  return (
    textures[texture] ||
    textures["fine-paper"]
  );
}

function normalizeState(input){

  const state =
    input &&
    typeof input === "object"
      ? {...input}
      : {};


  const title =
    state.title ??
    state.cardTitle ??
    "A Blessing For You";


  const recipient =
    state.to ??
    state.recipient ??
    "YSL";


  const from =
    state.from ??
    state.sender ??
    "KIM";


  const message =
    state.message ??
    state.msg ??
    "Your blessing will appear here";


  const texture =
    state.backgroundTexture ??
    state.texture ??
    "fine-paper";


  const photos =
    Array.isArray(state.photos)
      ? state.photos.map(function(photo){

          if (!photo || typeof photo !== "object") {
            return photo;
          }

          const normalizedPhoto = {
            ...photo
          };

          if (normalizedPhoto.x == null || !Number.isFinite(Number(normalizedPhoto.x))) {
            normalizedPhoto.x = 50;
          } else {
            normalizedPhoto.x = Math.max(0, Math.min(100, Number(normalizedPhoto.x)));
          }

          if (normalizedPhoto.y == null || !Number.isFinite(Number(normalizedPhoto.y))) {
            normalizedPhoto.y = 50;
          } else {
            normalizedPhoto.y = Math.max(0, Math.min(100, Number(normalizedPhoto.y)));
          }

          if (normalizedPhoto.width == null || !Number.isFinite(Number(normalizedPhoto.width))) {
            normalizedPhoto.width = 120;
          }

          if (normalizedPhoto.height == null || !Number.isFinite(Number(normalizedPhoto.height))) {
            normalizedPhoto.height = 120;
          }

          if (normalizedPhoto.cropX == null || !Number.isFinite(Number(normalizedPhoto.cropX))) {
            normalizedPhoto.cropX = 50;
          } else {
            normalizedPhoto.cropX = Math.max(0, Math.min(100, Number(normalizedPhoto.cropX)));
          }

          if (normalizedPhoto.cropY == null || !Number.isFinite(Number(normalizedPhoto.cropY))) {
            normalizedPhoto.cropY = 50;
          } else {
            normalizedPhoto.cropY = Math.max(0, Math.min(100, Number(normalizedPhoto.cropY)));
          }

          if (normalizedPhoto.cropZoom == null || !Number.isFinite(Number(normalizedPhoto.cropZoom))) {
            normalizedPhoto.cropZoom = 100;
          }

          if (normalizedPhoto.rotation == null || !Number.isFinite(Number(normalizedPhoto.rotation))) {
            normalizedPhoto.rotation = 0;
          }

          return normalizedPhoto;

        })
      : [];


  const normalizedTexture =
    normalizeTextureName(
      texture
    );


  return {

    ...state,

    title:title,

    to:recipient,

    recipient:recipient,

    from:from,

    sender:from,

    message:message,

    msg:message,

    photos:photos,

    symbol:
      state.symbol ??
      "✝",

    texture:
      normalizedTexture,

    backgroundTexture:
      normalizedTexture,

    textureColor:
      state.textureColor ??
      "#C89B3C",

    backgroundColor:
      state.backgroundColor ??
      state.bgColor ??
      state.cardBackground ??
      "#fffaf2",

    borderColor:
      state.borderColor ??
      "#C89B3C",

    innerBorderColor:
      state.innerBorderColor ??
      "#C89B3C",

    innerBorder:
      state.innerBorder ??
      "fine",

    fontColor:
      state.fontColor ??
      "#4C0A16",

    font:
      state.font ??
      state.fontFamily ??
      state.fontName ??
      "Georgia"

  };
}


/* =====================================================
   PREVIEW
===================================================== */

function renderPreview(s){

  s =
    normalizeState(s);


  const stage =
    document.createElement("div");

  stage.className =
    "stage";


  const card =
    document.createElement("article");

  card.className =
    "blessing";


  card.style.setProperty(
    "--bg",
    s.backgroundColor
  );

  card.style.setProperty(
    "--line",
    s.borderColor
  );

  card.style.setProperty(
    "--iline",
    s.innerBorderColor
  );

  card.style.setProperty(
    "--font",
    s.fontColor
  );

  card.style.setProperty(
    "--texture",
    getTexture(
      s.texture,
      s.textureColor
    )
  );


  const f =
    String(
      s.innerBorder
    ).toLowerCase();


  card.style.setProperty(
    "--iw",
    f === "double"
      ? "3px"
      : f === "none"
        ? "0px"
        : "1px"
  );


  card.style.setProperty(
    "--is",
    f === "dotted"
      ? "dotted"
      : f === "dashed"
        ? "dashed"
        : f === "double"
          ? "double"
          : "solid"
  );


  const family = getFontFamily(s.font);


  card.style.setProperty(
    "--family",
    family
  );


  const body =
    document.createElement("div");

  body.className =
    "body";


  body.innerHTML = `

    <div class="symbol">
      ${esc(s.symbol || "✝")}
    </div>

    <p class="to">
      For ${esc(s.to)}
    </p>

    <p class="message">
      ${esc(s.msg)}
    </p>

    <p class="verse">
      ${esc(s.verse || "")}
    </p>

    <p class="from">
      — ${esc(s.from || "")}
    </p>

  `;


  card.appendChild(body);


  const photos =
    document.createElement("div");

  photos.className =
    "photos";


  (
    Array.isArray(s.photos)
      ? s.photos
      : []
  )
  .slice(0,5)
  .forEach(p=>{

    const src =
      p &&
      (
        p.dataUrl ||
        p.url ||
        p.src
      );


    if(!src)return;


    const el =
      document.createElement("div");

    const img =
      document.createElement("img");


    el.className =
      "photo";


    const w =
      clamp(
        Number(p.width) || 120,
        10,
        1000
      );


    const h =
      clamp(
        Number(p.height) || 120,
        10,
        1000
      );


    const z =
      p.zoom != null
        ? Number(p.zoom) / 100
        : Number(p.cropZoom) || 1;


    el.style.width =
      w + "px";


    el.style.height =
      h + "px";


    let px = Number(p.x);
    let py = Number(p.y);

    if(!Number.isFinite(px)) px = 50;
    if(!Number.isFinite(py)) py = 50;

    if(p.positionMode !== "card" && px <= 10 && py <= 10){
      px = 50;
      py = 50;
    }

    el.style.left = clamp(px, 0, 100) + "%";
    el.style.top = clamp(py, 0, 100) + "%";


    el.style.transform =
      "translate(-50%,-50%)";


    img.src =
      src;


    const imageX = Number.isFinite(Number(p.cropX))
      ? clamp(Number(p.cropX), 0, 100)
      : 50;
    const imageY = Number.isFinite(Number(p.cropY))
      ? clamp(Number(p.cropY), 0, 100)
      : 50;

    img.style.objectFit = "initial";
    img.style.objectPosition = "50% 50%";
    img.style.position = "absolute";
    img.style.left = imageX + "%";
    img.style.top = imageY + "%";
    img.style.width = "auto";
    img.style.height = "auto";
    img.style.maxWidth = "none";
    img.style.maxHeight = "none";
    img.style.transform =
      `translate(-50%, -50%) scale(${Math.max(.1,z)}) rotate(${Number(p.rotation)||0}deg)`;
    img.style.transformOrigin = "center center";


    img.onerror =
      ()=>{
        el.remove();
      };


    el.appendChild(img);

    photos.appendChild(el);

  });


  card.appendChild(photos);

  stage.appendChild(card);


  return stage;

}


/* =====================================================
   FIT
===================================================== */

function fit(
  preview,
  stage
){

  stage.style.transform =
    `scale(${
      Math.min(
        (preview.clientWidth || 240) / 340,
        (preview.clientHeight || 270) / 460
      )
    })`;

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function render(items){

  grid.innerHTML =
    "";


  if(!items.length){

    status.style.display =
      "block";

    status.textContent =
      "You don't have any saved creations yet.";

    return;

  }


  status.style.display =
    "none";


  items.forEach(item=>{

    const wrap =
      document.createElement("article");

    wrap.className =
      "card";


    const preview =
      document.createElement("div");

    preview.className =
      "preview";


    const stage =
      renderPreview(
        item.state || {}
      );


    preview.appendChild(stage);

    wrap.appendChild(preview);


    const s =
      normalizeState(
        item.state || {}
      );


    const count =
      Array.isArray(s.photos)
        ? s.photos.length
        : 0;


    const meta =
      document.createElement("div");

    meta.className =
      "meta";


    meta.innerHTML = `

      <strong>
        ${esc(s.to)}
      </strong>

      <br>

      <small>
        Updated
        ${esc(
          date(
            item.updatedAt ||
            item.createdAt
          )
        )}

        •
        ${count}
        photo(s)
      </small>

    `;


    wrap.appendChild(meta);


    const actions =
      document.createElement("div");

    actions.className =
      "actions";


    const edit =
      document.createElement("button");

    edit.textContent =
      "Edit";


    edit.onclick =
      ()=>{

        location.href =
          "card-builder.html?edit=1#id=" +
          encodeURIComponent(
            item.id
          );

      };


    const del =
      document.createElement("button");

    del.textContent =
      "Delete";

    del.className =
      "danger";


    del.onclick =
      ()=>{

        delCard(
          item.id,
          wrap
        );

      };


    actions.append(
      edit,
      del
    );


    wrap.appendChild(actions);

    grid.appendChild(wrap);


    fit(
      preview,
      stage
    );

  });

}


/* =====================================================
   DATE
===================================================== */

function date(v){

  if(!v)
    return "—";


  const d =
    new Date(v);


  return isNaN(
    d.getTime()
  )
    ? String(v)
    : d.toLocaleString();

}


/* =====================================================
   DELETE
   MATCHES YOUR Code.gs
===================================================== */

function delCard(
  id,
  el
){

  if(
    !id ||
    !confirm(
      "Are you sure you want to delete this creation?\n\n" +
      "This action cannot be undone."
    )
  ){

    return;

  }


  status.style.display =
    "block";

  status.textContent =
    "Deleting creation…";


  /*
   * Your Code.gs doPost() expects:
   *
   * action
   * creatorId
   * userId
   * userKey
   * creationId
   */
  const f =
    document.createElement("form");


  f.method =
    "POST";

  f.action =
    API;

  f.target =
    "historyFrame";


  const values = {

    action:
      "delete",

    creatorId:
      creatorId,

    userId:
      legacyId || creatorId,

    userKey:
      creatorKey,

    creationId:
      id

  };


  Object.keys(values)
    .forEach(name=>{

      const input =
        document.createElement("input");

      input.type =
        "hidden";

      input.name =
        name;

      input.value =
        values[name];

      f.appendChild(input);

    });


  document.body.appendChild(f);

  f.submit();


  setTimeout(
    ()=>{

      f.remove();

      el.remove();


      if(
        grid.children.length
      ){

        status.style.display =
          "none";

      }

      else{

        status.style.display =
          "block";

        status.textContent =
          "You don't have any saved creations yet.";

      }

    },
    900
  );

}


/* =====================================================
   LOAD
   MATCHES YOUR Code.gs getHistory_()
===================================================== */

function load(){

  if(!API){

    status.textContent =
      "Could not connect to the blessing service. Check config.js.";

    return;

  }


  if(!creatorId){

    status.textContent =
      "Could not identify this creator. Please open the card builder first.";

    return;

  }


  status.textContent =
    "Loading your saved creations…";


  /*
   * JSONP callback.
   *
   * Code.gs response_() supports this.
   */
  const cb =
    "history_" +
    Date.now();


  window[cb] =
    data=>{

      try{

        delete window[cb];

      }

      catch(error){}


      if(
        data &&
        data.ok
      ){

        render(
          data.items || []
        );

      }

      else{

        status.textContent =
          data &&
          data.error
            ? data.error
            : "Could not load history.";

      }

    };


  /*
   * EXACT PARAMETERS EXPECTED BY
   * YOUR CURRENT Code.gs
   */
  const qs =
    new URLSearchParams({

      action:
        "getHistory",

      creatorId:
        creatorId,

      userId:
        legacyId || creatorId,

      userKey:
        creatorKey,

      callback:
        cb

    });


  const script =
    document.createElement("script");


  script.src =
    API +
    "?" +
    qs.toString();


  script.onerror =
    ()=>{

      try{
        delete window[cb];
      }catch(error){}

      status.textContent =
        "Could not connect to history service.";

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  ()=>{

    grid
      .querySelectorAll(".card")
      .forEach(card=>{

        const preview =
          card.querySelector(
            ".preview"
          );

        const stage =
          card.querySelector(
            ".stage"
          );


        if(
          preview &&
          stage
        ){

          fit(
            preview,
            stage
          );

        }

      });

  }
);


/* =====================================================
   START
===================================================== */

load();

})();

</script>
